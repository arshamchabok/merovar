<!doctype html>
<html><head><meta charset="utf-8"><title>pending</title></head>
<body>
<iframe id="frame" style="width:1200px;height:800px;border:0"></iframe>
<pre id="out">running</pre>
<script>
const results = [];
const check = (name, condition, detail = "") =>
  results.push(`${condition ? "PASS" : "FAIL"} ${name}${detail ? " :: " + detail : ""}`);

const frame = document.getElementById("frame");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Same origin as index.html, so this clears the editor's autosave before load.
try { localStorage.clear(); } catch (e) { /* ignore */ }

// Press, drag along a path, release — the freehand draw gesture.
function strokeAlong(win, el, path) {
  const send = (type, x, y, buttons) => el.dispatchEvent(new win.PointerEvent(type, {
    clientX: x, clientY: y, bubbles: true, cancelable: true,
    button: 0, buttons, pointerId: 3, pointerType: "mouse", isPrimary: true,
  }));
  send("pointerdown", path[0][0], path[0][1], 1);
  for (const [x, y] of path.slice(1)) send("pointermove", x, y, 1);
  send("pointerup", path[path.length - 1][0], path[path.length - 1][1], 0);
}

// Samples a circle, the way a hand would sweep round a territory.
// `turns` > 1 carries the stroke back past its own start, wobble adds tremor.
function circlePath(cx, cy, r, steps, turns = 1, wobble = 0) {
  return Array.from({ length: steps }, (_, i) => {
    const a = (i / steps) * Math.PI * 2 * turns;
    const jitter = wobble ? Math.sin(i * 2.7) * wobble + Math.sin(i * 6.1) * wobble * 0.6 : 0;
    return [cx + Math.cos(a) * (r + jitter), cy + Math.sin(a) * (r + jitter) * 0.72];
  });
}

// Does a closed polygon cross itself?
function selfIntersects(points) {
  const n = points.length;
  const cross = (a, b, c, d) => {
    const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return false;
    const t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / den;
    const u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / den;
    return t > 0.001 && t < 0.999 && u > 0.001 && u < 0.999;
  };
  for (let i = 0; i < n; i += 1) {
    for (let j = i + 2; j < n; j += 1) {
      if (i === 0 && j === n - 1) continue;
      if (cross(points[i], points[(i + 1) % n], points[j], points[(j + 1) % n])) return true;
    }
  }
  return false;
}

function clickAt(win, el, x, y) {
  for (const type of ["pointerdown", "pointerup", "click"]) {
    const Ctor = type === "click" ? win.MouseEvent : win.PointerEvent;
    el.dispatchEvent(new Ctor(type, {
      clientX: x, clientY: y, bubbles: true, cancelable: true,
      button: 0, buttons: type === "pointerdown" ? 1 : 0,
      pointerId: 1, pointerType: "mouse", isPrimary: true,
    }));
  }
}

frame.addEventListener("load", async () => {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const errors = [];
  win.addEventListener("error", e => errors.push(String(e.message)));

  try {
    await sleep(400);

    // --- structure -------------------------------------------------------
    check("94 settlements rendered", doc.querySelectorAll(".settlement").length === 94,
      String(doc.querySelectorAll(".settlement").length));
    check("map image untouched",
      doc.getElementById("map").getAttribute("src").startsWith("data:image/png;base64,"));
    const world = [...doc.getElementById("world").children].map(n => n.id || n.tagName);
    check("layer order map->kingdoms->settlements->handles",
      JSON.stringify(world) === JSON.stringify(["map", "kingdomLayer", "settlementLayer", "kingdomEditLayer"]),
      world.join(","));
    check("fills painted below strokes",
      [...doc.getElementById("kingdomLayer").children].map(n => n.id).join(",")
        .includes("kingdomFills,kingdomStrokes,kingdomLabels"));

    // --- APIs -------------------------------------------------------------
    const api = win.MerovarKingdomAPI;
    check("MerovarKingdomAPI exists", !!api);
    ["getAllKingdoms", "getKingdomById", "selectKingdom", "showKingdom", "hideKingdom",
     "getSettlementsInsideKingdom"].forEach(fn =>
      check(`API.${fn}`, typeof api?.[fn] === "function"));
    check("MerovarMapAPI still present", typeof win.MerovarMapAPI?.getSettlements === "function");
    check("settlement manifest has 94",
      win.MerovarMapAPI.getSettlements().length === 94);
    check("starts with no kingdoms", api.getAllKingdoms().length === 0);

    // --- draw a kingdom ---------------------------------------------------
    const viewport = doc.getElementById("viewport");
    doc.querySelector('.tool[data-mode="draw"]').click();
    check("draw mode active", doc.body.classList.contains("mode-draw"));
    const pts = [[400, 250], [800, 240], [820, 560], [380, 580]];
    pts.forEach(([x, y]) => clickAt(win, viewport, x, y));
    check("finish button enabled after 4 points", !doc.getElementById("finishButton").disabled);
    doc.getElementById("finishButton").click();
    await sleep(120);

    const all = api.getAllKingdoms();
    check("one kingdom created", all.length === 1, String(all.length));
    check("kingdom has 4 points", all[0]?.geometry.pointCount === 4, String(all[0]?.geometry.pointCount));
    const inBounds = all[0]?.geometry.points.every(p =>
      p.x >= 0 && p.x <= 3840 && p.y >= 0 && p.y <= 1645);
    check("points inside 3840x1645 space", inBounds,
      JSON.stringify(all[0]?.geometry.points));

    // --- DOM + metadata ----------------------------------------------------
    const id = all[0].id;
    const els = doc.querySelectorAll(`[data-kingdom-id="${id}"]`);
    check("kingdom rendered as fill+border+label", els.length === 3, String(els.length));
    const roles = [...els].map(e => e.dataset.kingdomRole).sort().join(",");
    check("roles present", roles === "border,fill,label", roles);
    check("data-kingdom-name set", [...els].every(e => "kingdomName" in e.dataset));
    check("data-ruling-house set", [...els].every(e => "rulingHouse" in e.dataset));
    check("data-capital-id set", [...els].every(e => "capitalId" in e.dataset));
    const fill = doc.querySelector(`.kingdom-fill[data-kingdom-id="${id}"]`);
    check("fill opacity is subtle", Number(fill.getAttribute("fill-opacity")) <= 0.15,
      fill.getAttribute("fill-opacity"));
    check("border path is a curve, not a polygon",
      doc.querySelector(".kingdom-line.main").getAttribute("d").includes("C"));

    // --- manifest ----------------------------------------------------------
    const manifest = JSON.parse(doc.getElementById("merovarKingdomManifest").textContent);
    check("manifest schema", manifest.schema === "merovar.kingdom-borders.v1");
    check("manifest lists kingdom", manifest.kingdoms.length === 1);
    check("manifest records every field",
      ["id", "name", "rulingHouse", "capitalSettlementId", "notes", "appearance", "geometry"]
        .every(k => k in manifest.kingdoms[0]));
    check("manifest stores every point",
      manifest.kingdoms[0].geometry.points.length === 4);

    // --- settlements inside -------------------------------------------------
    const inside = api.getSettlementsInsideKingdom(id);
    check("settlements inside computed", Array.isArray(inside) && inside.length > 0,
      `${inside.length} inside`);

    // --- click event ---------------------------------------------------------
    let fired = null;
    win.addEventListener("merovar:kingdom-click", e => { fired = e.detail; });
    api.selectKingdom(id);
    await sleep(60);
    check("merovar:kingdom-click fires", fired?.id === id);

    let settlementFired = null;
    win.addEventListener("merovar:settlement-click", e => { settlementFired = e.detail; });
    win.MerovarMapAPI.activate(win.MerovarMapAPI.getSettlements()[0].id, "test");
    await sleep(40);
    check("merovar:settlement-click still fires", !!settlementFired);

    // --- show / hide ----------------------------------------------------------
    api.hideKingdom(id);
    await sleep(60);
    check("hideKingdom hides fill",
      doc.querySelector(`.kingdom-fill[data-kingdom-id="${id}"]`).classList.contains("kingdom-hidden"));
    api.showKingdom(id);
    await sleep(60);
    check("showKingdom restores",
      !doc.querySelector(`.kingdom-fill[data-kingdom-id="${id}"]`).classList.contains("kingdom-hidden"));

    // --- undo / redo -----------------------------------------------------------
    doc.getElementById("undoButton").click();
    await sleep(80);
    check("undo removes the kingdom", api.getAllKingdoms().length === 0,
      String(api.getAllKingdoms().length));
    doc.getElementById("redoButton").click();
    await sleep(80);
    check("redo restores it", api.getAllKingdoms().length === 1);

    // --- export ---------------------------------------------------------------
    const exported = JSON.parse(JSON.stringify({
      kingdoms: api.getAllKingdoms(),
    }));
    check("export shape usable", exported.kingdoms[0].geometry.points.length === 4);

    // --- settlements untouched ---------------------------------------------------
    check("settlement count unchanged after edits",
      doc.querySelectorAll(".settlement").length === 94);
    const first = doc.querySelector(".settlement");
    check("settlement still positioned by map coords",
      first.style.left.endsWith("px") && first.dataset.mapAnchor === "bottom-center");
    check("settlements paint above kingdom layer",
      doc.getElementById("settlementLayer").compareDocumentPosition(doc.getElementById("kingdomLayer"))
        & Node.DOCUMENT_POSITION_PRECEDING);

    // --- label diagnostics ------------------------------------------------
    const nameInput = doc.getElementById("editName");
    nameInput.focus();
    nameInput.value = "Vareth Dominion";
    nameInput.dispatchEvent(new win.Event("input", { bubbles: true }));
    nameInput.blur();
    await sleep(200);
    const label = doc.querySelector(".kingdom-label");
    const labelBox = label.getBoundingClientRect();
    const labelStyle = win.getComputedStyle(label);
    check("label text set", label.textContent === "Vareth Dominion", label.textContent);
    check("label is displayed", labelStyle.display !== "none", labelStyle.display);
    check("label has on-screen size", labelBox.width > 40 && labelBox.height > 6,
      `w=${labelBox.width.toFixed(1)} h=${labelBox.height.toFixed(1)} font=${labelStyle.fontSize}`);
    check("label sits inside the viewport", labelBox.top > 0 && labelBox.left > 0,
      `top=${labelBox.top.toFixed(0)} left=${labelBox.left.toFixed(0)}`);

    // --- ink line visual weight -------------------------------------------
    const line = doc.querySelector(".kingdom-line.main");
    const lineBox = line.getBoundingClientRect();
    const lineStyle = win.getComputedStyle(line);
    check("ink stroke ~1.7 screen px",
      Math.abs(parseFloat(lineStyle.strokeWidth) * (lineBox.width / line.getBBox().width) - 1.7) < 0.6,
      `computed=${lineStyle.strokeWidth} onScreen=${(parseFloat(lineStyle.strokeWidth) * (lineBox.width / line.getBBox().width)).toFixed(2)}px`);

    // How far does the inked outline actually wander off the straight polygon?
    const poly = api.getKingdomById(id).geometry.points;
    const distToPoly = (px, py) => {
      let min = Infinity;
      for (let i = 0; i < poly.length; i += 1) {
        const a = poly[i], b = poly[(i + 1) % poly.length];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        const t = len2 ? Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / len2)) : 0;
        min = Math.min(min, Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t)));
      }
      return min;
    };
    const coords = [...line.getAttribute("d").matchAll(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g)].map(m => [+m[1], +m[2]]);
    const maxWander = Math.max(...coords.map(([x, y]) => distToPoly(x, y)));
    const px = lineBox.width / line.getBBox().width;
    check("outline wanders like ink at fit zoom", maxWander * px > 2.5 && maxWander * px < 26,
      `${maxWander.toFixed(1)} map units = ${(maxWander * px).toFixed(2)} screen px`);
    check("vertices stay exactly where clicked",
      poly.every(p => coords.some(([x, y]) => Math.hypot(x - p.x, y - p.y) < 1.5)),
      "corner points preserved");

    // --- zoom interaction ---------------------------------------------------
    const before = doc.querySelector(".kingdom-line.main").getBoundingClientRect().width;
    viewport.dispatchEvent(new win.WheelEvent("wheel", {
      clientX: 600, clientY: 400, deltaY: -600, bubbles: true, cancelable: true,
    }));
    await sleep(200);
    const after = doc.querySelector(".kingdom-line.main").getBoundingClientRect().width;
    check("border scales with zoom", after > before * 1.4, `${before.toFixed(0)} -> ${after.toFixed(0)}`);
    const zoomedStroke = parseFloat(win.getComputedStyle(doc.querySelector(".kingdom-line.main")).strokeWidth);
    const zoomedRatio = doc.querySelector(".kingdom-line.main").getBoundingClientRect().width /
      doc.querySelector(".kingdom-line.main").getBBox().width;
    check("stroke stays thin when zoomed", Math.abs(zoomedStroke * zoomedRatio - 1.7) < 0.6,
      `${(zoomedStroke * zoomedRatio).toFixed(2)}px on screen`);
    const settlementBox = doc.querySelector(".settlement").getBoundingClientRect();
    check("settlements scale with zoom", settlementBox.width > 10, `${settlementBox.width.toFixed(1)}px`);

    // --- freehand drawing ---------------------------------------------------
    doc.querySelector('.tool[data-mode="fit"]');
    doc.getElementById("fitButton").click();
    await sleep(150);
    const beforeDraw = api.getAllKingdoms().length;
    doc.querySelector('.tool[data-mode="draw"]').click();
    strokeAlong(win, viewport, circlePath(400, 400, 170, 90));
    await sleep(200);
    const drawn = api.getAllKingdoms();
    check("freehand stroke creates a kingdom", drawn.length === beforeDraw + 1,
      `${beforeDraw} -> ${drawn.length}`);
    const sketch = drawn[drawn.length - 1];
    check("stroke simplified to a workable number of points",
      sketch.geometry.pointCount >= 6 && sketch.geometry.pointCount <= 60,
      `${sketch.geometry.pointCount} points from 90 samples`);
    check("freehand shape keeps its area",
      sketch.geometry.areaSquareUnits > 100000, String(sketch.geometry.areaSquareUnits));
    check("freehand switches to edit mode with it selected",
      doc.body.classList.contains("mode-edit") && !doc.getElementById("inspector").classList.contains("hidden"));
    check("every freehand point is editable",
      doc.querySelectorAll(".vertex[data-vertex-index]").length === sketch.geometry.pointCount,
      `${doc.querySelectorAll(".vertex[data-vertex-index]").length} handles`);
    check("freehand points inside map space",
      sketch.geometry.points.every(p => p.x >= 0 && p.x <= 3840 && p.y >= 0 && p.y <= 1645));

    // A tap in draw mode should still place a single corner, not make a kingdom.
    doc.querySelector('.tool[data-mode="draw"]').click();
    clickAt(win, viewport, 700, 300);
    await sleep(80);
    check("a tap places a corner instead of closing",
      api.getAllKingdoms().length === drawn.length && doc.getElementById("cancelButton").disabled === false);
    doc.getElementById("cancelButton").click();
    await sleep(60);
    check("cancel clears the draft", doc.getElementById("cancelButton").disabled === true);

    // A stray tap must not leave a spike in the next freehand outline.
    clickAt(win, viewport, 1000, 650);
    await sleep(60);
    strokeAlong(win, viewport, circlePath(400, 300, 120, 70));
    await sleep(200);
    const latest = api.getAllKingdoms().at(-1);
    const strayFar = latest.geometry.points.some(p => {
      const others = latest.geometry.points.filter(q => q !== p);
      return others.every(q => Math.hypot(p.x - q.x, p.y - q.y) > 700);
    });
    check("stray tap is discarded, no spike in the shape", !strayFar,
      `${latest.geometry.pointCount} points`);

    // --- the reported bug: drawing back over your own starting point --------
    doc.querySelector('.tool[data-mode="draw"]').click();
    // 1.25 turns with tremor: the hand goes round and carries on past the start.
    strokeAlong(win, viewport, circlePath(430, 380, 150, 150, 1.25, 9));
    await sleep(220);
    const looped = api.getAllKingdoms().at(-1);
    check("overshooting the start still makes one clean kingdom",
      looped.geometry.pointCount >= 6 && looped.geometry.pointCount <= 60,
      `${looped.geometry.pointCount} points`);
    check("no self-crossing where the stroke overlapped itself",
      !selfIntersects(looped.geometry.points), "polygon is simple");
    check("overshoot trimmed, shape not collapsed",
      looped.geometry.areaSquareUnits > 200000,
      `${looped.geometry.areaSquareUnits} sq units`);
    const box = looped.geometry.boundingBox;
    check("shape stays a rough ellipse, no spike",
      box.width < 1800 && box.height < 1400, `${box.width.toFixed(0)}x${box.height.toFixed(0)}`);

    // The smoothed curve itself must not loop back on itself either.
    const curve = doc.querySelector(`.kingdom-line.main[data-kingdom-id]`) ||
      doc.querySelector(".kingdom-line.main");
    const curvePts = [...doc.querySelectorAll(".kingdom-line.main")].at(-1).getAttribute("d")
      .match(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g).map(s => {
        const [x, y] = s.split(" ").map(Number); return { x, y };
      });
    check("rendered ink curve has no knots",
      !selfIntersects(curvePts.filter((_, i) => i % 3 === 2)),
      `${curvePts.length} curve nodes`);

    // A tremor-heavy stroke should not come out visibly jagged.
    doc.querySelector('.tool[data-mode="draw"]').click();
    strokeAlong(win, viewport, circlePath(430, 380, 150, 160, 1, 14));
    await sleep(220);
    const shakyCount = api.getAllKingdoms().length;
    const shaky = api.getAllKingdoms().at(-1);
    check("hand tremor is smoothed away", shaky.geometry.pointCount <= 40,
      `${shaky.geometry.pointCount} points from a shaky stroke`);
    check("tremor shape is still simple", !selfIntersects(shaky.geometry.points));

    // --- the snap target you come back to ------------------------------------
    const hold = (type, x, y, buttons) => viewport.dispatchEvent(new win.PointerEvent(type, {
      clientX: x, clientY: y, bubbles: true, cancelable: true,
      button: 0, buttons, pointerId: 9, pointerType: "mouse", isPrimary: true,
    }));
    doc.querySelector('.tool[data-mode="draw"]').click();
    const loop = circlePath(500, 400, 140, 100);
    hold("pointerdown", loop[0][0], loop[0][1], 1);
    for (const [x, y] of loop.slice(1, 60)) hold("pointermove", x, y, 1);
    await sleep(60);
    const targetMid = doc.querySelector(".snap-target");
    check("snap target appears while drawing", !!targetMid);
    check("snap target sits on the stroke start", targetMid &&
      Math.abs(targetMid.getBoundingClientRect().left +
        targetMid.getBoundingClientRect().width / 2 - loop[0][0]) < 6,
      `x=${targetMid?.getBoundingClientRect().left.toFixed(0)}`);
    check("snap target not armed part-way round",
      targetMid && !targetMid.classList.contains("armed"));
    for (const [x, y] of loop.slice(60)) hold("pointermove", x, y, 1);
    hold("pointermove", loop[0][0], loop[0][1], 1);
    await sleep(60);
    check("snap target arms on returning to the start",
      doc.querySelector(".snap-target")?.classList.contains("armed"));
    check("outline goes solid when armed",
      doc.querySelector(".draft-line")?.classList.contains("armed"));
    hold("pointerup", loop[0][0], loop[0][1], 0);
    await sleep(200);
    check("releasing on the target closes the shape",
      api.getAllKingdoms().length === shakyCount + 1 && !doc.querySelector(".snap-target"));
  } catch (error) {
    check("harness completed", false, `${error && error.message} @ ${error && error.stack?.split("\n")[1]}`);
  }

  check("no runtime errors", errors.length === 0, errors.join(" | "));
  const failed = results.filter(r => r.startsWith("FAIL"));
  document.title = failed.length ? `FAILED ${failed.length}` : `ALL PASS ${results.length}`;
  document.getElementById("out").textContent = results.join("\n");
});

frame.src = "/index.html";
</script>
</body></html>
