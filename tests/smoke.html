<!doctype html>
<html><head><meta charset="utf-8"><title>pending</title></head>
<body>
<iframe id="frame" style="width:1200px;height:800px;border:0"></iframe>
<pre id="out">running</pre>
<script>
const results = [];
// Written out as we go: if the run stalls, the last line says where.
const check = (name, condition, detail = "") => {
  results.push(`${condition ? "PASS" : "FAIL"} ${name}${detail ? " :: " + detail : ""}`);
  const out = document.getElementById("out");
  if (out) out.textContent = results.join("\n");
};

const frame = document.getElementById("frame");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Same origin as index.html, so this clears the editor's autosave before load.
try { localStorage.clear(); } catch (e) { /* ignore */ }

// Press, drag along a path, release — the freehand draw gesture.
function strokeAlong(win, el, path, button = 0) {
  const send = (type, x, y, buttons) => el.dispatchEvent(new win.PointerEvent(type, {
    clientX: x, clientY: y, bubbles: true, cancelable: true,
    button, buttons, pointerId: 3, pointerType: "mouse", isPrimary: true,
  }));
  send("pointerdown", path[0][0], path[0][1], 1);
  for (const [x, y] of path.slice(1)) send("pointermove", x, y, 1);
  send("pointerup", path[path.length - 1][0], path[path.length - 1][1], 0);
}

// Draw the whole loop and come back to the start so it closes.
function drawClosed(win, el, path) {
  strokeAlong(win, el, [...path, path[0]]);
}

// Samples a circle, the way a hand would sweep round a territory.
// `turns` > 1 carries the stroke back past its own start, wobble adds tremor.
function circlePath(cx, cy, r, steps, turns = 1, wobble = 0) {
  return Array.from({ length: steps }, (_, i) => {
    const a = (i / steps) * Math.PI * 2 * turns;
    const jitter = wobble ? Math.sin(i * 2.7) * wobble + Math.sin(i * 6.1) * wobble * 0.6 : 0;
    return [cx + Math.cos(a) * (r + jitter), cy + Math.sin(a) * (r + jitter) * 0.72];
  });
}

// Does a closed polygon cross itself?
function selfIntersects(points) {
  const n = points.length;
  const cross = (a, b, c, d) => {
    const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y;
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return false;
    const t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / den;
    const u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / den;
    return t > 0.001 && t < 0.999 && u > 0.001 && u < 0.999;
  };
  for (let i = 0; i < n; i += 1) {
    for (let j = i + 2; j < n; j += 1) {
      if (i === 0 && j === n - 1) continue;
      if (cross(points[i], points[(i + 1) % n], points[j], points[(j + 1) % n])) return true;
    }
  }
  return false;
}

function clickAt(win, el, x, y) {
  for (const type of ["pointerdown", "pointerup", "click"]) {
    const Ctor = type === "click" ? win.MouseEvent : win.PointerEvent;
    el.dispatchEvent(new Ctor(type, {
      clientX: x, clientY: y, bubbles: true, cancelable: true,
      button: 0, buttons: type === "pointerdown" ? 1 : 0,
      pointerId: 1, pointerType: "mouse", isPrimary: true,
    }));
  }
}

frame.addEventListener("load", async () => {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const errors = [];
  win.addEventListener("error", e => errors.push(String(e.message)));
  // A native dialog stalls headless virtual time, so answer them in code.
  win.confirm = () => true;

  try {
    await sleep(400);

    // --- structure -------------------------------------------------------
    check("94 settlements rendered", doc.querySelectorAll(".settlement").length === 94,
      String(doc.querySelectorAll(".settlement").length));
    check("map image untouched",
      doc.getElementById("map").getAttribute("src").startsWith("data:image/png;base64,"));
    const world = [...doc.getElementById("world").children].map(n => n.id || n.tagName);
    check("layer order map->kingdoms->settlements->handles",
      JSON.stringify(world) === JSON.stringify(["map", "kingdomLayer", "settlementLayer", "kingdomEditLayer"]),
      world.join(","));
    check("fills painted below strokes",
      [...doc.getElementById("kingdomLayer").children].map(n => n.id).join(",")
        .includes("kingdomFills,kingdomStrokes,kingdomLabels"));

    // --- APIs -------------------------------------------------------------
    const api = win.MerovarKingdomAPI;
    check("MerovarKingdomAPI exists", !!api);
    ["getAllKingdoms", "getKingdomById", "selectKingdom", "showKingdom", "hideKingdom",
     "getSettlementsInsideKingdom"].forEach(fn =>
      check(`API.${fn}`, typeof api?.[fn] === "function"));
    check("MerovarMapAPI still present", typeof win.MerovarMapAPI?.getSettlements === "function");
    check("settlement manifest has 94",
      win.MerovarMapAPI.getSettlements().length === 94);
    check("starts with no kingdoms", api.getAllKingdoms().length === 0);

    // --- draw a kingdom ---------------------------------------------------
    const viewport = doc.getElementById("viewport");
    doc.querySelector('.tool[data-mode="draw"]').click();
    check("draw mode active", doc.body.classList.contains("mode-draw"));
    // Drag round a rectangle, densely enough to look like a hand tracing it.
    const corners = [[400, 250], [800, 240], [820, 560], [380, 580]];
    const rect = [];
    corners.forEach((from, i) => {
      const to = corners[(i + 1) % corners.length];
      for (let s = 0; s < 14; s += 1) {
        rect.push([from[0] + (to[0] - from[0]) * s / 14, from[1] + (to[1] - from[1]) * s / 14]);
      }
    });
    strokeAlong(win, viewport, rect.slice(0, -6)); // stops short of the start
    await sleep(120);
    check("unclosed drag leaves a draft, not a kingdom",
      api.getAllKingdoms().length === 0 && !doc.getElementById("finishButton").disabled);
    doc.getElementById("finishButton").click();
    await sleep(120);

    const all = api.getAllKingdoms();
    check("one kingdom created", all.length === 1, String(all.length));
    check("traced rectangle keeps its corners",
      all[0]?.geometry.pointCount >= 4 && all[0]?.geometry.pointCount <= 14,
      `${all[0]?.geometry.pointCount} points`);
    const inBounds = all[0]?.geometry.points.every(p =>
      p.x >= 0 && p.x <= 3840 && p.y >= 0 && p.y <= 1645);
    check("points inside 3840x1645 space", inBounds,
      `${all[0]?.geometry.pointCount} points in bounds`);

    // --- DOM + metadata ----------------------------------------------------
    const id = all[0].id;
    const els = doc.querySelectorAll(`[data-kingdom-id="${id}"]`);
    check("kingdom rendered as fill+border+label", els.length === 3, String(els.length));
    const roles = [...els].map(e => e.dataset.kingdomRole).sort().join(",");
    check("roles present", roles === "border,fill,label", roles);
    check("data-kingdom-name set", [...els].every(e => "kingdomName" in e.dataset));
    check("data-ruling-house set", [...els].every(e => "rulingHouse" in e.dataset));
    check("data-capital-id set", [...els].every(e => "capitalId" in e.dataset));
    const fill = doc.querySelector(`.kingdom-fill[data-kingdom-id="${id}"]`);
    check("fill opacity is subtle", Number(fill.getAttribute("fill-opacity")) <= 0.15,
      fill.getAttribute("fill-opacity"));
    check("border path is a curve, not a polygon",
      doc.querySelector(".kingdom-line.main").getAttribute("d").includes("C"));

    // --- manifest ----------------------------------------------------------
    const manifest = JSON.parse(doc.getElementById("merovarKingdomManifest").textContent);
    check("manifest schema", manifest.schema === "merovar.kingdom-borders.v1");
    check("manifest lists kingdom", manifest.kingdoms.length === 1);
    check("manifest records every field",
      ["id", "name", "rulingHouse", "capitalSettlementId", "notes", "appearance", "geometry"]
        .every(k => k in manifest.kingdoms[0]));
    check("manifest stores every point",
      manifest.kingdoms[0].geometry.points.length === all[0].geometry.pointCount);

    // --- settlements inside -------------------------------------------------
    const inside = api.getSettlementsInsideKingdom(id);
    check("settlements inside computed", Array.isArray(inside) && inside.length > 0,
      `${inside.length} inside`);

    // --- click event ---------------------------------------------------------
    let fired = null;
    win.addEventListener("merovar:kingdom-click", e => { fired = e.detail; });
    api.selectKingdom(id);
    await sleep(60);
    check("merovar:kingdom-click fires", fired?.id === id);

    let settlementFired = null;
    win.addEventListener("merovar:settlement-click", e => { settlementFired = e.detail; });
    win.MerovarMapAPI.activate(win.MerovarMapAPI.getSettlements()[0].id, "test");
    await sleep(40);
    check("merovar:settlement-click still fires", !!settlementFired);

    // --- show / hide ----------------------------------------------------------
    api.hideKingdom(id);
    await sleep(60);
    check("hideKingdom hides fill",
      doc.querySelector(`.kingdom-fill[data-kingdom-id="${id}"]`).classList.contains("kingdom-hidden"));
    api.showKingdom(id);
    await sleep(60);
    check("showKingdom restores",
      !doc.querySelector(`.kingdom-fill[data-kingdom-id="${id}"]`).classList.contains("kingdom-hidden"));

    // --- undo / redo -----------------------------------------------------------
    doc.getElementById("undoButton").click();
    await sleep(80);
    check("undo removes the kingdom", api.getAllKingdoms().length === 0,
      String(api.getAllKingdoms().length));
    doc.getElementById("redoButton").click();
    await sleep(80);
    check("redo restores it", api.getAllKingdoms().length === 1);

    // --- export ---------------------------------------------------------------
    const exported = JSON.parse(JSON.stringify({
      kingdoms: api.getAllKingdoms(),
    }));
    check("export shape usable",
      exported.kingdoms[0].geometry.points.length === all[0].geometry.pointCount);

    // --- settlements untouched ---------------------------------------------------
    check("settlement count unchanged after edits",
      doc.querySelectorAll(".settlement").length === 94);
    const first = doc.querySelector(".settlement");
    check("settlement still positioned by map coords",
      first.style.left.endsWith("px") && first.dataset.mapAnchor === "bottom-center");
    check("settlements paint above kingdom layer",
      doc.getElementById("settlementLayer").compareDocumentPosition(doc.getElementById("kingdomLayer"))
        & Node.DOCUMENT_POSITION_PRECEDING);

    // --- label diagnostics ------------------------------------------------
    const nameInput = doc.getElementById("editName");
    nameInput.focus();
    nameInput.value = "Vareth Dominion";
    nameInput.dispatchEvent(new win.Event("input", { bubbles: true }));
    nameInput.blur();
    await sleep(200);
    const label = doc.querySelector(".kingdom-label");
    const labelBox = label.getBoundingClientRect();
    const labelStyle = win.getComputedStyle(label);
    check("label text set", label.textContent === "Vareth Dominion", label.textContent);
    check("label is displayed", labelStyle.display !== "none", labelStyle.display);
    check("label has on-screen size", labelBox.width > 40 && labelBox.height > 6,
      `w=${labelBox.width.toFixed(1)} h=${labelBox.height.toFixed(1)} font=${labelStyle.fontSize}`);
    check("label sits inside the viewport", labelBox.top > 0 && labelBox.left > 0,
      `top=${labelBox.top.toFixed(0)} left=${labelBox.left.toFixed(0)}`);

    // --- ink line visual weight -------------------------------------------
    const line = doc.querySelector(".kingdom-line.main");
    const lineBox = line.getBoundingClientRect();
    const lineStyle = win.getComputedStyle(line);
    check("ink stroke ~1.7 screen px",
      Math.abs(parseFloat(lineStyle.strokeWidth) * (lineBox.width / line.getBBox().width) - 1.7) < 0.6,
      `computed=${lineStyle.strokeWidth} onScreen=${(parseFloat(lineStyle.strokeWidth) * (lineBox.width / line.getBBox().width)).toFixed(2)}px`);

    // How far does the inked outline actually wander off the straight polygon?
    const poly = api.getKingdomById(id).geometry.points;
    const distToPoly = (px, py) => {
      let min = Infinity;
      for (let i = 0; i < poly.length; i += 1) {
        const a = poly[i], b = poly[(i + 1) % poly.length];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len2 = dx * dx + dy * dy;
        const t = len2 ? Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / len2)) : 0;
        min = Math.min(min, Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t)));
      }
      return min;
    };
    const coords = [...line.getAttribute("d").matchAll(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g)].map(m => [+m[1], +m[2]]);
    const maxWander = Math.max(...coords.map(([x, y]) => distToPoly(x, y)));
    const px = lineBox.width / line.getBBox().width;
    check("outline wanders like ink at fit zoom", maxWander * px > 2.5 && maxWander * px < 26,
      `${maxWander.toFixed(1)} map units = ${(maxWander * px).toFixed(2)} screen px`);
    check("vertices stay exactly where clicked",
      poly.every(p => coords.some(([x, y]) => Math.hypot(x - p.x, y - p.y) < 1.5)),
      "corner points preserved");

    // --- zoom interaction ---------------------------------------------------
    const before = doc.querySelector(".kingdom-line.main").getBoundingClientRect().width;
    viewport.dispatchEvent(new win.WheelEvent("wheel", {
      clientX: 600, clientY: 400, deltaY: -600, bubbles: true, cancelable: true,
    }));
    await sleep(200);
    const after = doc.querySelector(".kingdom-line.main").getBoundingClientRect().width;
    check("border scales with zoom", after > before * 1.4, `${before.toFixed(0)} -> ${after.toFixed(0)}`);
    const zoomedStroke = parseFloat(win.getComputedStyle(doc.querySelector(".kingdom-line.main")).strokeWidth);
    const zoomedRatio = doc.querySelector(".kingdom-line.main").getBoundingClientRect().width /
      doc.querySelector(".kingdom-line.main").getBBox().width;
    check("stroke stays thin when zoomed", Math.abs(zoomedStroke * zoomedRatio - 1.7) < 0.6,
      `${(zoomedStroke * zoomedRatio).toFixed(2)}px on screen`);
    const settlementBox = doc.querySelector(".settlement").getBoundingClientRect();
    check("settlements scale with zoom", settlementBox.width > 10, `${settlementBox.width.toFixed(1)}px`);

    // --- freehand drawing ---------------------------------------------------
    doc.querySelector('.tool[data-mode="fit"]');
    doc.getElementById("fitButton").click();
    await sleep(150);
    const beforeDraw = api.getAllKingdoms().length;
    doc.querySelector('.tool[data-mode="draw"]').click();
    drawClosed(win, viewport, circlePath(400, 400, 170, 90));
    await sleep(200);
    const drawn = api.getAllKingdoms();
    check("freehand stroke creates a kingdom", drawn.length === beforeDraw + 1,
      `${beforeDraw} -> ${drawn.length}`);
    const sketch = drawn[drawn.length - 1];
    check("stroke simplified to a workable number of points",
      sketch.geometry.pointCount >= 6 && sketch.geometry.pointCount <= 60,
      `${sketch.geometry.pointCount} points from 90 samples`);
    check("freehand shape keeps its area",
      sketch.geometry.areaSquareUnits > 100000, String(sketch.geometry.areaSquareUnits));
    check("freehand switches to edit mode with it selected",
      doc.body.classList.contains("mode-edit") && !doc.getElementById("inspector").classList.contains("hidden"));
    check("every freehand point is editable",
      doc.querySelectorAll(".vertex[data-vertex-index]").length === sketch.geometry.pointCount,
      `${doc.querySelectorAll(".vertex[data-vertex-index]").length} handles`);
    check("freehand points inside map space",
      sketch.geometry.points.every(p => p.x >= 0 && p.x <= 3840 && p.y >= 0 && p.y <= 1645));

    // --- panning while drawing must never create a kingdom -------------------
    const worldOf = () => doc.getElementById("world").style.transform;
    doc.querySelector('.tool[data-mode="draw"]').click();
    const countBeforePan = api.getAllKingdoms().length;

    // At fit zoom the map is centred and clamped, so it cannot pan at all.
    viewport.dispatchEvent(new win.WheelEvent("wheel", {
      clientX: 600, clientY: 400, deltaY: -900, bubbles: true, cancelable: true }));
    await sleep(120);
    const panBefore = worldOf();
    win.dispatchEvent(new win.KeyboardEvent("keydown", { code: "Space", bubbles: true }));
    strokeAlong(win, viewport, [[600, 400], [640, 420], [700, 450], [760, 470]]);
    win.dispatchEvent(new win.KeyboardEvent("keyup", { code: "Space", bubbles: true }));
    await sleep(120);
    check("space-drag pans instead of drawing", worldOf() !== panBefore, "map moved");
    check("space-drag creates no kingdom", api.getAllKingdoms().length === countBeforePan);
    check("space-drag leaves no draft", doc.getElementById("cancelButton").disabled === true);

    const rightBefore = worldOf();
    strokeAlong(win, viewport, [[600, 400], [650, 430], [720, 460]], 2);
    await sleep(120);
    check("right-drag pans instead of drawing", worldOf() !== rightBefore);
    check("right-drag creates no kingdom", api.getAllKingdoms().length === countBeforePan);

    // A plain drag that is not closed must leave a draft, not a kingdom.
    doc.getElementById("fitButton").click();
    await sleep(120);
    strokeAlong(win, viewport, [[300, 300], [420, 300], [520, 380], [560, 470]]);
    await sleep(120);
    check("an unclosed stroke creates no kingdom",
      api.getAllKingdoms().length === countBeforePan, `${api.getAllKingdoms().length}`);
    check("an unclosed stroke leaves an open draft",
      doc.getElementById("cancelButton").disabled === false && !!doc.querySelector(".draft-line"));
    check("resume point marks where drawing continues", !!doc.querySelector(".resume-point"));

    // Zooming between passes must not disturb the outline.
    const draftBefore = doc.querySelector(".draft-line").getAttribute("d");
    viewport.dispatchEvent(new win.WheelEvent("wheel", {
      clientX: 500, clientY: 400, deltaY: -300, bubbles: true, cancelable: true }));
    await sleep(120);
    check("outline survives zooming mid-draw",
      doc.querySelector(".draft-line")?.getAttribute("d") === draftBefore, "geometry unchanged");
    doc.getElementById("fitButton").click();
    await sleep(120);

    // A second pass continues the same outline rather than starting over.
    strokeAlong(win, viewport, [[560, 470], [430, 500], [320, 430]]);
    await sleep(120);
    check("a second pass continues the same outline",
      api.getAllKingdoms().length === countBeforePan && !!doc.querySelector(".draft-line"));
    doc.getElementById("finishButton").click();
    await sleep(200);
    check("Finish closes a multi-pass outline",
      api.getAllKingdoms().length === countBeforePan + 1,
      `${api.getAllKingdoms().length}`);
    const multi = api.getAllKingdoms().at(-1);
    check("multi-pass shape is simple", !selfIntersects(multi.geometry.points),
      `${multi.geometry.pointCount} points`);

    // A tap in draw mode should do nothing at all now.
    doc.querySelector('.tool[data-mode="draw"]').click();
    const countBeforeTap = api.getAllKingdoms().length;
    clickAt(win, viewport, 700, 300);
    await sleep(80);
    check("a tap in draw mode creates nothing",
      api.getAllKingdoms().length === countBeforeTap &&
      doc.getElementById("cancelButton").disabled === true);

    drawClosed(win, viewport, circlePath(400, 300, 120, 70));
    await sleep(200);
    const latest = api.getAllKingdoms().at(-1);
    const strayFar = latest.geometry.points.some(p => {
      const others = latest.geometry.points.filter(q => q !== p);
      return others.every(q => Math.hypot(p.x - q.x, p.y - q.y) > 700);
    });
    check("no spike from the earlier tap", !strayFar, `${latest.geometry.pointCount} points`);

    // Backspace drops the last pass only.
    doc.querySelector('.tool[data-mode="draw"]').click();
    strokeAlong(win, viewport, [[300, 300], [400, 320], [480, 360]]);
    strokeAlong(win, viewport, [[480, 360], [500, 460], [420, 500]]);
    await sleep(100);
    const twoPass = doc.querySelector(".draft-line").getAttribute("d").length;
    win.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Backspace", bubbles: true }));
    await sleep(100);
    check("Backspace removes only the last pass",
      doc.querySelector(".draft-line") &&
      doc.querySelector(".draft-line").getAttribute("d").length < twoPass, "outline shortened");
    doc.getElementById("cancelButton").click();
    await sleep(60);
    check("cancel clears the draft", doc.getElementById("cancelButton").disabled === true);

    // --- islands and separate landmasses -------------------------------------
    doc.getElementById("fitButton").click();
    await sleep(120);
    doc.querySelector('.tool[data-mode="draw"]').click();
    drawClosed(win, viewport, circlePath(350, 380, 120, 60));
    await sleep(200);
    const mainland = api.getAllKingdoms().at(-1);
    const beforeIsland = api.getAllKingdoms().length;
    check("mainland starts as one part", mainland.geometry.partCount === 1);

    doc.querySelector('.tool[data-mode="island"]').click();
    check("add island mode active", doc.body.classList.contains("mode-island"));
    drawClosed(win, viewport, circlePath(620, 300, 55, 40));
    await sleep(200);
    check("island does not become a separate kingdom",
      api.getAllKingdoms().length === beforeIsland,
      `${api.getAllKingdoms().length} kingdoms`);
    const withIsland = api.getKingdomById(mainland.id);
    check("island joins the selected kingdom", withIsland.geometry.partCount === 2,
      `${withIsland.geometry.partCount} parts`);
    check("parts labelled mainland and island",
      withIsland.geometry.parts.map(p => p.role).sort().join(",") === "island,mainland",
      withIsland.geometry.parts.map(p => `${p.role}:${p.pointCount}`).join(" "));
    check("area counts both landmasses",
      withIsland.geometry.areaSquareUnits >
      withIsland.geometry.parts.find(p => p.role === "mainland").areaSquareUnits);

    // One fill, one ink line, one name — but two subpaths.
    const islandFill = doc.querySelector(`.kingdom-fill[data-kingdom-id="${mainland.id}"]`);
    check("both parts drawn in a single fill",
      (islandFill.getAttribute("d").match(/M /g) || []).length === 2,
      `${(islandFill.getAttribute("d").match(/M /g) || []).length} subpaths`);
    check("still one label for the whole kingdom",
      doc.querySelectorAll(`.kingdom-label[data-kingdom-id="${mainland.id}"]`).length === 1);
    check("data-part-count exposed", islandFill.dataset.partCount === "2");

    // The name must sit on the mainland, not adrift between the parts.
    const labelEl = doc.querySelector(`.kingdom-label[data-kingdom-id="${mainland.id}"]`);
    const mainRing = withIsland.geometry.parts.find(p => p.role === "mainland");
    const anchor = withIsland.geometry.labelAnchor;
    const insideMain = (() => {
      let hit = false;
      const pts = mainRing.points;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i, i += 1) {
        if ((pts[i].y > anchor.y) !== (pts[j].y > anchor.y) &&
          anchor.x < ((pts[j].x - pts[i].x) * (anchor.y - pts[i].y)) / (pts[j].y - pts[i].y) + pts[i].x) hit = !hit;
      }
      return hit;
    })();
    check("name sits on the mainland", insideMain && !!labelEl);

    // Editing reaches every part.
    doc.querySelector('.tool[data-mode="edit"]').click();
    api.selectKingdom(mainland.id);
    await sleep(120);
    const handleParts = new Set([...doc.querySelectorAll(".vertex[data-vertex-index]")]
      .map(h => h.dataset.partIndex));
    check("handles appear on both parts", handleParts.size === 2,
      `parts with handles: ${[...handleParts].join(",")}`);
    check("handle count matches total points",
      doc.querySelectorAll(".vertex[data-vertex-index]").length === withIsland.geometry.pointCount);

    // Settlements inside either landmass belong to the kingdom.
    const insideBoth = api.getSettlementsInsideKingdom(mainland.id).length;
    check("settlements counted across parts", insideBoth >= withIsland.settlementsInside.count,
      `${insideBoth} inside`);

    // Moving the kingdom must carry the island with it.
    const beforeMove = api.getKingdomById(mainland.id).geometry.parts.map(p => p.centroid);
    const fillBox = islandFill.getBoundingClientRect();
    strokeAlong(win, viewport, [
      [fillBox.left + fillBox.width / 2, fillBox.top + fillBox.height / 2],
      [fillBox.left + fillBox.width / 2 + 40, fillBox.top + fillBox.height / 2 + 25],
      [fillBox.left + fillBox.width / 2 + 70, fillBox.top + fillBox.height / 2 + 40],
    ]);
    await sleep(150);
    const afterMove = api.getKingdomById(mainland.id).geometry.parts.map(p => p.centroid);
    const shifted = afterMove.map((c, i) => ({
      dx: c.x - beforeMove[i].x, dy: c.y - beforeMove[i].y,
    }));
    check("island moves with the mainland",
      shifted.every(s => Math.abs(s.dx) > 1) &&
      Math.abs(shifted[0].dx - shifted[1].dx) < 1.5 &&

      for (const [sx, sy] of path) {
        const map = { x: (sx - worldScale.ox) / worldScale.s, y: (sy - worldScale.oy) / worldScale.s };
        let best = Infinity;
        for (let i = 0; i < ring.length; i += 1) {
          const a = ring[i], b = ring[(i + 1) % ring.length];
          const dx = b.x - a.x, dy = b.y - a.y;
          const len2 = dx * dx + dy * dy;
          const t = len2 ? Math.max(0, Math.min(1, ((map.x - a.x) * dx + (map.y - a.y) * dy) / len2)) : 0;
          best = Math.min(best, Math.hypot(map.x - (a.x + dx * t), map.y - (a.y + dy * t)));

        worst = Math.max(worst, best);

      for (const [sx, sy] of path) {
        const map = { x: (sx - worldScale.ox) / worldScale.s, y: (sy - worldScale.oy) / worldScale.s };

      [...doc.querySelectorAll(".legend-row .legend-name")].some(n => n.textContent === "Ashlow Reach"),
      [...doc.querySelectorAll(".legend-name")].map(n => n.textContent).join("/"));
    check("legend swatch uses the realm's own ink",
      doc.querySelector(".legend-swatch").style.borderColor !== "");
    check("empty state hidden when realms exist",
      doc.getElementById("legendEmpty").classList.contains("hidden"));
    check("cartouche reports the survey",
      /realm/i.test(doc.getElementById("cartoucheLine").textContent),
      doc.getElementById("cartoucheLine").textContent);
    check("survey figures counted from the settlements",
      /\d+ cities · \d+ towns · \d+ castles/.test(doc.getElementById("surveyLine").textContent),
      doc.getElementById("surveyLine").textContent);
    check("scale bar reports map units",
      /\d+ units/.test(doc.getElementById("scaleLabel").textContent),
      doc.getElementById("scaleLabel").textContent);

    // Selecting from the legend opens the plate and frames the realm.
    const beforeFocus = doc.getElementById("world").style.transform;
    [...doc.querySelectorAll(".legend-row")]
      .find(row => row.dataset.kingdomRow === showId).click();
    await sleep(2600);
    check("realm plate opens", !doc.getElementById("plate").classList.contains("hidden"));
    check("plate names the realm",
      doc.getElementById("plateName").textContent === "Ashlow Reach",
      `got "${doc.getElementById("plateName").textContent}" · legend has ` +
      [...doc.querySelectorAll(".legend-name")].map(n => n.textContent).join("/"));
    check("plate shows the ruling house",
      doc.getElementById("plateHouse").textContent === "House Vharn",
      `got "${doc.getElementById("plateHouse").textContent}"`);
    const statLabels = [...doc.querySelectorAll("#plateStats dt")].map(d => d.textContent);
    check("plate reports real figures",
      ["Settlements", "Cities", "Towns", "Castles", "Landmasses", "Area"]
        .every(k => statLabels.includes(k)), statLabels.join(","));
    check("camera framed the realm",
      doc.getElementById("world").style.transform !== beforeFocus, "view moved");
    const others = [...doc.querySelectorAll(".kingdom-fill[data-kingdom-id]")]
      .filter(el => el.dataset.kingdomId !== showId);
    check("the chosen realm stays lit",
      !doc.querySelector(`.kingdom-fill[data-kingdom-id="${showId}"]`).classList.contains("dimmed"));
    check("other realms recede", others.length > 0 && others.every(el => el.classList.contains("dimmed")),
      `${others.filter(el => el.classList.contains("dimmed")).length}/${others.length} dimmed`);

    doc.getElementById("plateClose").click();
    await sleep(900);
    check("closing the plate returns to the whole map",
      doc.getElementById("plate").classList.contains("hidden"));

    // Clicking a settlement in the showcase names it rather than editing it.
    const anyone = doc.querySelector(".settlement");
    const spot = anyone.getBoundingClientRect();
    viewport.dispatchEvent(new win.PointerEvent("pointermove", {
      clientX: spot.left + spot.width / 2, clientY: spot.top + spot.height / 2,
      bubbles: true, pointerId: 7, pointerType: "mouse", isPrimary: true }));
    await sleep(120);
    check("settlement tooltip appears on hover",
      !doc.getElementById("settlementTip").classList.contains("hidden"));
    check("tooltip names the settlement",
      /town|city|castle/i.test(doc.getElementById("settlementTip").textContent),
      doc.getElementById("settlementTip").textContent);

    check("no editing is possible while presenting",
      doc.body.classList.contains("mode-move"));

    win.MerovarStage.edit();
    await sleep(200);
    check("returning to the editor restores the toolbar",
      !doc.body.classList.contains("presenting") &&
      win.getComputedStyle(doc.getElementById("toolbar")).display !== "none");
    check("leaving the showcase closes its panels",
      doc.getElementById("plate").classList.contains("hidden") &&
      doc.getElementById("settlementTip").classList.contains("hidden"));

    api.selectKingdom(showId);
    doc.getElementById("deleteButton").click();
    await sleep(150);

    // --- legacy single-ring data still loads ----------------------------------
    // Runs last: importing replaces every kingdom.
    const legacy = JSON.stringify({
      kingdoms: [{
        id: "legacy-1", name: "Old Realm", borderColor: "#4a3527", fillColor: "#8a6a4e",
        fillOpacity: 0.1, notes: "", rulingHouse: "", capitalId: "",
        points: [{ x: 500, y: 400 }, { x: 900, y: 420 }, { x: 880, y: 700 }, { x: 520, y: 690 }],
      }],
    });
    const importedOk = (() => {
      try {
        win.eval(`(${function (json) {
          const input = document.getElementById("importJsonInput");
          const file = new File([json], "k.json", { type: "application/json" });
          const dt = new DataTransfer();
          dt.items.add(file);
          input.files = dt.files;
          input.dispatchEvent(new Event("change", { bubbles: true }));
        }.toString()})(${JSON.stringify(legacy)})`);
        return true;
      } catch (e) { return false; }
    })();
    if (importedOk) {
      await sleep(900);
      const old = api.getAllKingdoms().find(k => k.name === "Old Realm");
      check("legacy points-only kingdom still loads", !!old && old.geometry.partCount === 1,
        old ? `${old.geometry.pointCount} points` : "not imported");
      check("legacy kingdom keeps compat points array",
        !!old && Array.isArray(old.geometry.points) && old.geometry.points.length === 4);
    } else {
      check("legacy import harness ran", false, "could not drive the file input");
    }

  } catch (error) {
    check("harness completed", false, `${error && error.message} @ ${error && error.stack?.split("\n")[1]}`);
  }

  // --- which face the site opens with -------------------------------------
  // Loaded in their own frames so the real entry path is exercised.
  const openIn = (query) => new Promise(resolve => {
    const probe = document.createElement("iframe");
    probe.style.cssText = "width:900px;height:600px;border:0;position:absolute;left:-9999px";
    probe.addEventListener("load", () => setTimeout(() => resolve(probe), 700));
    document.body.appendChild(probe);
    probe.src = `/index.html${query}`;
  });

  try {
    const plain = await openIn("");
    const plainDoc = plain.contentDocument;
    check("the site opens in the editor by default",
      !plainDoc.body.classList.contains("presenting") &&
      plain.contentWindow.getComputedStyle(plainDoc.getElementById("toolbar")).display !== "none",
      plainDoc.body.className);
    check("the showcase is still built in, just not shown",
      !!plainDoc.getElementById("stage") && !!plainDoc.getElementById("cartouche") &&
      typeof plain.contentWindow.MerovarStage?.present === "function");
    plain.remove();

    const viewed = await openIn("?view=1");
    const viewedDoc = viewed.contentDocument;
    check("?view opens the showcase", viewedDoc.body.classList.contains("presenting"),
      viewedDoc.body.className);
    viewed.remove();

    const edited = await openIn("?edit=1");
    check("?edit opens the editor",
      !edited.contentDocument.body.classList.contains("presenting"));
    edited.remove();

    // The toolbar button is the way across without touching the URL.
    const both = await openIn("");
    both.contentDocument.getElementById("presentButton").click();
    await sleep(500);
    check("View map switches to the showcase",
      both.contentDocument.body.classList.contains("presenting"));
    both.contentDocument.getElementById("openEditor").click();
    await sleep(300);
    check("Editor switches back",
      !both.contentDocument.body.classList.contains("presenting"));
    both.remove();
  } catch (error) {
    check("entry point checks ran", false, String(error && error.message));
  }

  check("no runtime errors", errors.length === 0, errors.join(" | "));
  const failed = results.filter(r => r.startsWith("FAIL"));
  document.title = failed.length ? `FAILED ${failed.length}` : `ALL PASS ${results.length}`;
  document.getElementById("out").textContent = results.join("\n");
});

frame.src = "/index.html?edit=1";
</script>
</body></html>
