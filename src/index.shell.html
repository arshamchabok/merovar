<!--
  Source shell for index.html.

  The three huge inline payloads (map image, settlement icon library, settlement
  records) are NOT stored here — `npm run build` copies them byte-for-byte out of
  the existing index.html into the placeholders below. Edit this file, run the
  build, and index.html is regenerated as a standalone document.
-->
<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Merovar — World Map &amp; Kingdom Borders</title>
<style>
:root {
  color-scheme: dark;
  --panel: rgba(25,18,13,.94);
  --panel2: rgba(41,30,22,.97);
  --border: rgba(255,235,202,.24);
  --text: #f7e7c7;
  --muted: #cdb791;
  --accent: #d4a85f;
  --good: #9bd39b;
}
* { box-sizing: border-box; }
html, body {
  width:100%; height:100%; margin:0; overflow:hidden;
  background:#0b0907; color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
}
body { touch-action:none; user-select:none; }
button,input,textarea,select { font:inherit; }
button { color:inherit; }

/* ---------------------------------------------------------------- map stage */
#viewport {
  position:fixed; inset:0; overflow:hidden; cursor:grab;
  background:radial-gradient(circle at center,#4b3522 0%,#1d140f 66%,#080605 100%);
}
#viewport.dragging { cursor:grabbing; }
#viewport.drawing { cursor:crosshair; }
#viewport.panning, #viewport.panning.drawing { cursor:grab; }
#viewport.panning.dragging { cursor:grabbing; }
#viewport.picking { cursor:copy; }
#world {
  position:absolute; left:0; top:0; width:3840px; height:1645px;
  transform-origin:0 0; will-change:transform;
}
#map {
  position:absolute; inset:0; width:3840px; height:1645px; display:block;
  pointer-events:none; -webkit-user-drag:none; image-rendering:auto;
}

/* Layer order inside #world:
   map image -> kingdom fills -> kingdom lines + names -> settlements -> edit handles */
#kingdomLayer, #kingdomEditLayer {
  position:absolute; inset:0; width:3840px; height:1645px;
  overflow:visible; pointer-events:none;
}
#settlementLayer {
  position:absolute; inset:0; width:3840px; height:1645px;
  pointer-events:none;
}

/* ------------------------------------------------------------- settlements */
.settlement {
  position:absolute; transform-origin:50% 100%; pointer-events:auto;
  cursor:pointer; isolation:isolate; touch-action:none;
}
.settlement img {
  width:100%; height:auto; display:block; pointer-events:none; -webkit-user-drag:none;
  filter:drop-shadow(0 2px 1.5px rgba(55,35,19,.26));
  opacity:.985;
}
body.locked-settlements .settlement { pointer-events:none; }
.settlement.selected {
  outline:3px dashed rgba(255,239,183,.88); outline-offset:5px; border-radius:6px;
}
.settlement.selected img {
  filter:drop-shadow(0 0 8px rgba(255,239,183,.92)) drop-shadow(0 2px 1.5px rgba(55,35,19,.30));
}
body.mode-settlement .settlement { cursor:grab; }

/* --------------------------------------------------------- kingdom artwork */
.kingdom-fill {
  pointer-events:fill; cursor:pointer;
  transition:fill-opacity .18s ease;
}
.kingdom-line {
  fill:none; stroke-linejoin:round; stroke-linecap:round; pointer-events:none;
  stroke-width:calc(var(--k-ink,3) * 1px);
}
.kingdom-line.halo {
  stroke-width:calc(var(--k-ink,3) * 2.4px);
  opacity:.16;
}
.kingdom-line.under {
  stroke-width:calc(var(--k-ink,3) * .75px);
  opacity:.5;
}
.kingdom-line.main { opacity:.88; }
.kingdom-group.is-hover .kingdom-line.main { opacity:.97; }
.kingdom-group.is-hover .kingdom-line.halo { opacity:.3; }
.kingdom-group.is-selected .kingdom-line.main { opacity:1; }
.kingdom-group.is-selected .kingdom-line.halo { opacity:.34; }
.kingdom-label {
  pointer-events:none; text-anchor:middle; dominant-baseline:middle;
  font-family:Georgia,"Times New Roman",serif; font-style:italic;
  font-size:calc(var(--k-label,60) * 1px);
  letter-spacing:calc(var(--k-label,60) * .07px);
  paint-order:stroke fill;
  stroke:rgba(246,234,206,.5);
  stroke-width:calc(var(--k-label,60) * .1px);
  stroke-linejoin:round;
  opacity:.78;
}
.kingdom-group.is-hover .kingdom-label, .kingdom-group.is-selected .kingdom-label { opacity:.95; }
body.hide-borders #kingdomLayer, body.hide-borders #kingdomEditLayer { display:none; }
body.hide-names .kingdom-label { display:none; }
.kingdom-hidden { display:none; }

/* ------------------------------------------------------------ edit handles */
.draft-line {
  fill:rgba(212,168,95,.07); stroke:rgba(244,213,152,.85);
  stroke-width:calc(var(--k-ink,3) * 1px);
  stroke-dasharray:calc(var(--k-ink,3) * 4px) calc(var(--k-ink,3) * 3px);
  stroke-linejoin:round; stroke-linecap:round; pointer-events:none;
}
/* Back at the start: the outline goes solid to say "let go now". */
.draft-line.armed {
  stroke:rgba(255,236,187,.98); stroke-dasharray:none;
  fill:rgba(212,168,95,.13);
}
.snap-target {
  fill:rgba(26,18,12,.42); stroke:rgba(255,236,187,.9);
  stroke-width:calc(var(--k-ink,3) * 1.3px);
  stroke-dasharray:calc(var(--k-ink,3) * 3px) calc(var(--k-ink,3) * 2.5px);
  pointer-events:none;
}
.snap-target.armed {
  fill:rgba(255,236,187,.42); stroke:rgba(255,247,222,1); stroke-dasharray:none;
  stroke-width:calc(var(--k-ink,3) * 2px);
}
.resume-point {
  fill:rgba(255,236,187,.9); stroke:rgba(40,28,18,.8);
  stroke-width:calc(var(--k-handle,10) * .18px); pointer-events:none;
}
.vertex {
  fill:rgba(28,20,14,.85); stroke:#f4d598;
  stroke-width:calc(var(--k-handle,10) * .22px);
  pointer-events:all; cursor:grab;
}
.vertex:hover { fill:#f4d598; }
.vertex.dragging { cursor:grabbing; fill:#f4d598; }
.midpoint {
  fill:rgba(244,213,152,.28); stroke:rgba(244,213,152,.8);
  stroke-width:calc(var(--k-handle,10) * .16px);
  pointer-events:all; cursor:copy;
}
.midpoint:hover { fill:#f4d598; }
body.mode-delpoint .vertex { cursor:not-allowed; stroke:#ef8d7c; }
body.mode-delpoint .midpoint { display:none; }
body.mode-addpoint .midpoint { fill:rgba(244,213,152,.55); }

/* -------------------------------------------------------------------- chrome */
#toolbar {
  position:fixed; z-index:50; left:50%; top:10px; transform:translateX(-50%);
  display:flex; align-items:center; gap:6px; max-width:calc(100vw - 20px); overflow-x:auto;
  padding:8px; border:1px solid var(--border); border-radius:14px;
  background:var(--panel); box-shadow:0 16px 48px rgba(0,0,0,.46); backdrop-filter:blur(14px);
  scrollbar-width:thin;
}
.tool {
  flex:0 0 auto; min-height:36px; padding:0 11px; border:1px solid transparent;
  border-radius:8px; background:rgba(255,239,213,.08); cursor:pointer; white-space:nowrap;
}
.tool:hover { background:rgba(255,239,213,.15); }
.tool.active { border-color:rgba(255,245,218,.70); background:rgba(212,168,95,.25); }
.tool:disabled { opacity:.4; cursor:not-allowed; }
.tool.danger { background:rgba(193,61,49,.26); }
.tool.primary { background:rgba(155,211,155,.22); }
.separator { flex:0 0 auto; width:1px; height:28px; background:var(--border); }
.control {
  display:flex; align-items:center; gap:6px; flex:0 0 auto;
  color:var(--muted); font-size:12px; white-space:nowrap;
}

#palette {
  position:fixed; z-index:48; left:12px; top:66px; width:292px;
  padding:12px; border:1px solid var(--border); border-radius:12px;
  background:var(--panel2); box-shadow:0 16px 44px rgba(0,0,0,.38); backdrop-filter:blur(12px);
}
#palette.hidden { display:none; }
#palette h2 { margin:0 0 8px; font-size:17px; }
.type-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.type-tab {
  padding:7px 5px; border:1px solid var(--border); border-radius:7px;
  background:rgba(255,255,255,.05); cursor:pointer;
}
.type-tab.active { background:rgba(212,168,95,.22); border-color:rgba(255,235,202,.55); }
#designGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:9px; }
.design-option {
  position:relative; height:82px; padding:4px; display:grid; place-items:center;
  border:1px solid rgba(255,235,202,.18); border-radius:8px;
  background:rgba(255,255,255,.045); cursor:pointer;
}
.design-option:hover { background:rgba(255,255,255,.09); }
.design-option.active { border-color:#f4d598; box-shadow:inset 0 0 0 1px rgba(244,213,152,.45); }
.design-option img { max-width:100%; max-height:70px; object-fit:contain; pointer-events:none; }
.design-number { position:absolute; right:4px; bottom:3px; font-size:10px; color:var(--muted); }
.palette-help { margin:9px 0 0; color:var(--muted); font-size:12px; line-height:1.38; }
.design-mini-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.design-mini {
  height:62px; padding:3px; display:grid; place-items:center; border:1px solid var(--border);
  border-radius:7px; background:rgba(255,255,255,.04); cursor:pointer;
}
.design-mini.active { border-color:#f4d598; background:rgba(212,168,95,.18); }
.design-mini img { max-width:100%; max-height:54px; object-fit:contain; pointer-events:none; }

#inspector, #settlementInspector {
  position:fixed; z-index:55; right:12px; top:66px; width:min(340px,calc(100vw - 24px));
  max-height:calc(100vh - 150px); overflow-y:auto;
  padding:14px; border:1px solid var(--border); border-radius:12px;
  background:var(--panel2); box-shadow:0 18px 50px rgba(0,0,0,.45); backdrop-filter:blur(14px);
}
#inspector.hidden, #settlementInspector.hidden { display:none; }
#inspector h2, #settlementInspector h2 { margin:0 0 2px; font-size:18px; }
.inspector-sub { margin:0 0 6px; color:var(--muted); font-size:12px; }
.field { display:grid; gap:5px; margin-top:9px; color:var(--muted); font-size:12px; }
.field input,.field textarea,.field select {
  width:100%; border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,.06);
  color:var(--text); padding:8px 9px; outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus { border-color:var(--accent); }
.field input[type="color"] { height:36px; padding:2px; cursor:pointer; }
.field input[type="range"] { padding:0; }
.field textarea { min-height:58px; resize:vertical; }
.inline-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.inspector-actions { display:flex; justify-content:space-between; gap:8px; margin-top:12px; }

#status {
  position:fixed; z-index:49; left:12px; bottom:12px; max-width:min(760px,calc(100vw - 24px));
  padding:9px 12px; border:1px solid var(--border); border-radius:10px; background:var(--panel);
  color:var(--muted); font-size:13px; pointer-events:none; backdrop-filter:blur(12px);
}
#status strong { color:var(--text); }
#saveState { color:var(--good); }

#nav {
  position:fixed; z-index:20; right:14px; bottom:14px;
  display:flex; gap:6px; padding:6px;
  border:1px solid var(--border); border-radius:12px;
  background:rgba(25,18,13,.86); box-shadow:0 12px 32px rgba(0,0,0,.42);
  backdrop-filter:blur(12px); opacity:.55; transition:opacity .18s ease;
}
#nav:hover, #nav:focus-within { opacity:1; }
#nav button {
  width:36px; height:36px; padding:0;
  display:flex; align-items:center; justify-content:center;
  border:1px solid transparent; border-radius:8px;
  background:transparent; color:var(--text);
  font:600 17px/1 Georgia,"Times New Roman",serif; cursor:pointer;
}
#nav button:hover { background:rgba(212,168,95,.18); border-color:var(--border); }

@media (max-width:1100px) {
  #toolbar { top:auto; bottom:8px; left:8px; right:8px; transform:none; max-width:none; }
  #status { bottom:auto; top:8px; left:8px; }
  #inspector { top:8px; right:8px; max-height:calc(100vh - 90px); }
  #nav { bottom:64px; }
}
</style>
</head>
<body class="locked-settlements">

<nav id="toolbar" aria-label="Kingdom border editor controls">
  <button class="tool active" data-mode="move" type="button">Move Map</button>
  <button class="tool" data-mode="settlement" type="button" title="Place towns, cities and castles using the existing artwork">Add Settlement</button>
  <button class="tool" data-mode="draw" type="button" title="Press and drag to draw an outline; let go to close it">Draw Kingdom</button>
  <button class="tool" data-mode="island" type="button" title="Draw another landmass belonging to the selected kingdom">Add Island</button>
  <button class="tool" data-mode="edit" type="button">Select / Edit Border</button>
  <button class="tool" data-mode="addpoint" type="button">Add Point</button>
  <button class="tool" data-mode="delpoint" type="button">Delete Point</button>
  <div class="separator"></div>
  <button id="finishButton" class="tool primary" type="button" disabled>Finish</button>
  <button id="cancelButton" class="tool" type="button" disabled>Cancel</button>
  <div class="separator"></div>
  <button id="undoButton" class="tool" type="button" disabled>Undo</button>
  <button id="redoButton" class="tool" type="button" disabled>Redo</button>
  <button id="deleteKingdomButton" class="tool danger" type="button" disabled>Delete Kingdom</button>
  <div class="separator"></div>
  <label class="control"><input id="showBorders" type="checkbox" checked> Borders</label>
  <label class="control"><input id="showNames" type="checkbox" checked> Names</label>
  <div class="separator"></div>
  <button id="saveButton" class="tool" type="button">Save</button>
  <button id="saveHtmlButton" class="tool" type="button">Save Edited HTML</button>
  <button id="exportJsonButton" class="tool" type="button">Export Kingdom JSON</button>
  <button id="importJsonButton" class="tool" type="button">Import Kingdom JSON</button>
  <input id="importJsonInput" type="file" accept=".json,application/json" hidden>
  <div class="separator"></div>
  <button id="fitButton" class="tool" type="button">Fit Map</button>
  <button id="fullscreenButton" class="tool" type="button">Fullscreen</button>
</nav>

<main id="viewport">
  <div id="world">
<!--MEROVAR:MAP_IMG-->
    <svg id="kingdomLayer" viewBox="0 0 3840 1645" aria-hidden="true">
      <defs>
        <!-- Optional extra ink grain. Left disconnected on purpose: at 8x zoom the
             browser has to rasterise this filter over a very large surface, which
             stutters on an 18 MB page. The wobble in the path geometry already
             carries the hand-drawn look. To enable, add filter="url(#inkTexture)"
             to #kingdomStrokes below. -->
        <filter id="inkTexture" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <g id="kingdomFills"></g>
      <g id="kingdomStrokes"></g>
      <g id="kingdomLabels"></g>
    </svg>
    <div id="settlementLayer"></div>
    <svg id="kingdomEditLayer" viewBox="0 0 3840 1645" aria-hidden="true">
      <g id="draftGroup"></g>
      <g id="handleGroup"></g>
    </svg>
  </div>
</main>

<aside id="palette" class="hidden" aria-label="Settlement artwork">
  <h2>Settlement artwork</h2>
  <div class="type-tabs">
    <button class="type-tab active" data-type="town" type="button">Town</button>
    <button class="type-tab" data-type="city" type="button">City</button>
    <button class="type-tab" data-type="castle" type="button">Castle</button>
  </div>
  <div id="designGrid"></div>
  <label class="field">Size <span id="newSizeValue"></span>
    <input id="newSize" type="range" min="28" max="90" step="1">
  </label>
  <p class="palette-help">Click the map to place. Click a settlement to select it, drag to move it.</p>
</aside>

<section id="settlementInspector" class="hidden" aria-label="Settlement properties">
  <h2 id="settlementTitle">Settlement</h2>
  <p class="inspector-sub" id="settlementMeta"></p>
  <label class="field">Name<input id="sName" type="text" maxlength="80" placeholder="Optional name"></label>
  <label class="field">Type
    <select id="sType">
      <option value="town">Town</option>
      <option value="city">City</option>
      <option value="castle">Castle</option>
    </select>
  </label>
  <div class="field">Design<div id="sDesignGrid" class="design-mini-grid"></div></div>
  <div class="inline-fields">
    <label class="field">Width<input id="sWidth" type="number" min="20" max="200" step="1"></label>
    <label class="field">Rotation<input id="sRotation" type="number" min="-180" max="180" step="1"></label>
  </div>
  <label class="field">Notes<textarea id="sNotes" placeholder="Optional notes"></textarea></label>
  <div class="inspector-actions">
    <button id="sDuplicate" class="tool" type="button">Duplicate</button>
    <button id="sDelete" class="tool danger" type="button">Delete</button>
    <button id="sClose" class="tool" type="button">Close</button>
  </div>
</section>

<section id="inspector" class="hidden" aria-label="Kingdom properties">
  <h2 id="inspectorTitle">Kingdom</h2>
  <p class="inspector-sub" id="inspectorMeta"></p>
  <label class="field">Name<input id="editName" type="text" maxlength="80" placeholder="Kingdom name"></label>
  <label class="field">Ruling house<input id="editHouse" type="text" maxlength="80" placeholder="Optional"></label>
  <label class="field">Capital settlement
    <select id="editCapital"><option value="">None</option></select>
  </label>
  <div class="inline-fields">
    <label class="field">Border colour<input id="editBorderColor" type="color"></label>
    <label class="field">Fill colour<input id="editFillColor" type="color"></label>
  </div>
  <label class="field">Fill opacity <span id="fillOpacityValue"></span>
    <input id="editFillOpacity" type="range" min="0" max="0.45" step="0.01">
  </label>
  <label class="field">Notes<textarea id="editNotes" placeholder="Optional notes"></textarea></label>
  <label class="field">Absorb another kingdom
    <select id="mergeKingdom"><option value="">Choose a kingdom…</option></select>
  </label>
  <div class="inspector-actions">
    <button id="duplicateButton" class="tool" type="button">Duplicate</button>
    <button id="deleteButton" class="tool danger" type="button">Delete</button>
    <button id="closeInspectorButton" class="tool" type="button">Close</button>
  </div>
</section>

<div id="status"><strong id="modeLabel">Move Map</strong> · <span id="countLabel"></span> · <span id="saveState">Ready</span></div>

<div id="nav">
  <button id="zoomOut" type="button" title="Zoom out (−)" aria-label="Zoom out">−</button>
  <button id="zoomIn" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
  <button id="navFit" type="button" title="Fit map (0)" aria-label="Fit map">⤢</button>
  <button id="navFull" type="button" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
</div>

<script id="merovarSettlementManifest" type="application/json">{}</script>
<script id="merovarKingdomManifest" type="application/json">{}</script>
<script>
(() => {
  "use strict";

  const MAP_WIDTH = 3840;
  const MAP_HEIGHT = 1645;
  const MIN_SCALE = 0.08;
  const MAX_SCALE = 8;
  const KINGDOM_STORAGE_KEY = "merovar-kingdom-borders-v1";
  const SETTLEMENT_STORAGE_KEY = "merovar-settlements-v2";

  // Typical size of the settlements already on the map, so new ones match.
  const DEFAULT_WIDTH = { town: 46, city: 55, castle: 42 };

  // On-screen sizes (CSS px) that stay constant regardless of zoom.
  const INK_SCREEN_PX = 1.7;
  const LABEL_SCREEN_PX = 17;
  const HANDLE_SCREEN_PX = 6;
  const SNAP_SCREEN_PX = 26;

  const clone = (value) => JSON.parse(JSON.stringify(value));
  const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const uid = (prefix) =>
    `${prefix}-${Date.now().toString(36)}-${Math.random().toString(16).slice(2, 10)}`;

  const iconLibrary = JSON.parse(document.getElementById("iconLibraryData").textContent);
  let settlements = [];

  // Muted ink/wash pairs; new kingdoms cycle through them.
  const PALETTE = [
    { border: "#4a3527", fill: "#8a6a4e" },
    { border: "#33402f", fill: "#5d6b52" },
    { border: "#3b2f45", fill: "#6b5a76" },
    { border: "#472b2a", fill: "#7a5350" },
    { border: "#2c3a42", fill: "#4f6470" },
    { border: "#4a3d21", fill: "#7d6b3f" },
    { border: "#2f403a", fill: "#566b62" },
    { border: "#402c35", fill: "#6d4f5c" },
  ];

  const dom = {
    viewport: document.getElementById("viewport"),
    world: document.getElementById("world"),
    kingdomLayer: document.getElementById("kingdomLayer"),
    editLayer: document.getElementById("kingdomEditLayer"),
    fills: document.getElementById("kingdomFills"),
    strokes: document.getElementById("kingdomStrokes"),
    labels: document.getElementById("kingdomLabels"),
    draftGroup: document.getElementById("draftGroup"),
    handleGroup: document.getElementById("handleGroup"),
    settlementLayer: document.getElementById("settlementLayer"),
    settlementManifest: document.getElementById("merovarSettlementManifest"),
    kingdomManifest: document.getElementById("merovarKingdomManifest"),
    palette: document.getElementById("palette"),
    designGrid: document.getElementById("designGrid"),
    newSize: document.getElementById("newSize"),
    newSizeValue: document.getElementById("newSizeValue"),
    settlementInspector: document.getElementById("settlementInspector"),
    settlementTitle: document.getElementById("settlementTitle"),
    settlementMeta: document.getElementById("settlementMeta"),
    sName: document.getElementById("sName"),
    sType: document.getElementById("sType"),
    sDesignGrid: document.getElementById("sDesignGrid"),
    sWidth: document.getElementById("sWidth"),
    sRotation: document.getElementById("sRotation"),
    sNotes: document.getElementById("sNotes"),
    inspector: document.getElementById("inspector"),
    inspectorTitle: document.getElementById("inspectorTitle"),
    inspectorMeta: document.getElementById("inspectorMeta"),
    editName: document.getElementById("editName"),
    editHouse: document.getElementById("editHouse"),
    editCapital: document.getElementById("editCapital"),
    editBorderColor: document.getElementById("editBorderColor"),
    editFillColor: document.getElementById("editFillColor"),
    editFillOpacity: document.getElementById("editFillOpacity"),
    fillOpacityValue: document.getElementById("fillOpacityValue"),
    editNotes: document.getElementById("editNotes"),
    mergeKingdom: document.getElementById("mergeKingdom"),
    finishButton: document.getElementById("finishButton"),
    cancelButton: document.getElementById("cancelButton"),
    undoButton: document.getElementById("undoButton"),
    redoButton: document.getElementById("redoButton"),
    deleteKingdomButton: document.getElementById("deleteKingdomButton"),
    showBorders: document.getElementById("showBorders"),
    showNames: document.getElementById("showNames"),
    modeLabel: document.getElementById("modeLabel"),
    countLabel: document.getElementById("countLabel"),
    saveState: document.getElementById("saveState"),
  };

  const SVG_NS = "http://www.w3.org/2000/svg";
  const svgEl = (name) => document.createElementNS(SVG_NS, name);

  let kingdoms = [];
  let scale = 1, offsetX = 0, offsetY = 0;
  let userAdjustedView = false;
  let mode = "move";
  let selectedId = null;
  // An outline in progress, as one array per press-drag-release. Drawing it in
  // several passes is what lets you zoom and pan part-way through.
  let draftSegments = null;
  let activeSegment = null;
  let spaceHeld = false;
  const undoStack = [];
  const redoStack = [];

  /* ====================================================== geometry helpers */

  function hashSeed(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i += 1) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRandom(seed) {
    let state = seed >>> 0;
    return () => {
      state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  // A turn sharper than this is a deliberate corner and is kept as one; gentler
  // turns get rounded. Keeps click-placed rectangles rectangular while letting
  // freehand loops read as curves.
  const SHARP_TURN = Math.PI * 0.31;

  // Centripetal Catmull-Rom (alpha = 0.5) control points for each edge of the
  // ring. The uniform form overshoots on tight turns and ties the curve in
  // little knots — exactly what a hand-drawn outline is full of.
  function bezierRing(points) {
    const n = points.length;
    const knot = (a, b) => Math.pow(Math.hypot(b.x - a.x, b.y - a.y), 0.5) || 1e-4;

    const sharp = points.map((p, i) => {
      const prev = points[(i - 1 + n) % n];
      const next = points[(i + 1) % n];
      const incoming = Math.atan2(p.y - prev.y, p.x - prev.x);
      const outgoing = Math.atan2(next.y - p.y, next.x - p.x);
      let turn = Math.abs(outgoing - incoming);
      if (turn > Math.PI) turn = 2 * Math.PI - turn;
      return turn > SHARP_TURN;
    });

    const segments = [];
    for (let i = 0; i < n; i += 1) {
      const p0 = points[(i - 1 + n) % n];
      const p1 = points[i];
      const p2 = points[(i + 1) % n];
      const p3 = points[(i + 2) % n];
      const d1 = knot(p0, p1);
      const d2 = knot(p1, p2);
      const d3 = knot(p2, p3);
      const c1 = {};
      const c2 = {};
      for (const axis of ["x", "y"]) {
        c1[axis] = (d1 * d1 * p2[axis] - d2 * d2 * p0[axis] +
          (2 * d1 * d1 + 3 * d1 * d2 + d2 * d2) * p1[axis]) / (3 * d1 * (d1 + d2));
        c2[axis] = (d3 * d3 * p1[axis] - d2 * d2 * p3[axis] +
          (2 * d3 * d3 + 3 * d3 * d2 + d2 * d2) * p2[axis]) / (3 * d3 * (d3 + d2));
      }
      // Collapsing a tangent onto its vertex makes that end of the edge straight.
      segments.push({
        p1,
        p2,
        c1: sharp[i] ? { ...p1 } : c1,
        c2: sharp[(i + 1) % n] ? { ...p2 } : c2,
      });
    }
    return segments;
  }

  const bezierAt = (s, t) => {
    const u = 1 - t;
    const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return {
      x: a * s.p1.x + b * s.c1.x + c * s.c2.x + d * s.p2.x,
      y: a * s.p1.y + b * s.c1.y + c * s.c2.y + d * s.p2.y,
    };
  };

  const bezierTangent = (s, t) => {
    const u = 1 - t;
    const a = 3 * u * u, b = 6 * u * t, c = 3 * t * t;
    return {
      x: a * (s.c1.x - s.p1.x) + b * (s.c2.x - s.c1.x) + c * (s.p2.x - s.c2.x),
      y: a * (s.c1.y - s.p1.y) + b * (s.c2.y - s.c1.y) + c * (s.p2.y - s.c2.y),
    };
  };

  // Samples along the smoothed outline and lets the line wander sideways so it
  // reads as an inked stroke. The wander is a damped random walk — low
  // frequency, like a hand drifting — not per-sample noise, which is just
  // jitter. Sampling follows the curve, never the straight chord, or the
  // smoothing would have nothing left to round. Deterministic per kingdom id.
  function roughenPolygon(points, seed, amplitudeScale = 1) {
    const random = makeRandom(seed);
    const out = [];
    bezierRing(points).forEach(segment => {
      const length = Math.hypot(segment.p2.x - segment.p1.x, segment.p2.y - segment.p1.y) || 1;
      const steps = clamp(Math.round(length / 40), 3, 24);
      // Low floor: a freehand outline has many short segments and already
      // carries the hand's own character — it must not be squiggled further.
      const amp = clamp(length * 0.022, 2.5, 24) * amplitudeScale;

      let wander = 0;
      for (let step = 0; step < steps; step += 1) {
        const t = step / steps;
        wander = wander * 0.55 + (random() - 0.5) * 2 * 0.45;
        const base = bezierAt(segment, t);
        const tangent = bezierTangent(segment, t);
        const magnitude = Math.hypot(tangent.x, tangent.y) || 1;
        // Taper to zero at the corners so the vertices stay exactly where placed.
        const taper = Math.sin(Math.PI * t);
        const offset = wander * 1.9 * amp * taper;
        out.push({
          x: base.x - (tangent.y / magnitude) * offset,
          y: base.y + (tangent.x / magnitude) * offset,
        });
      }
    });
    return out;
  }

  function smoothClosedPath(points) {
    if (points.length < 3) return "";
    let d = `M ${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
    bezierRing(points).forEach(s => {
      d += ` C ${s.c1.x.toFixed(2)} ${s.c1.y.toFixed(2)}, ${s.c2.x.toFixed(2)} ${s.c2.y.toFixed(2)}, ${s.p2.x.toFixed(2)} ${s.p2.y.toFixed(2)}`;
    });
    return `${d} Z`;
  }

  function segmentIntersection(a, b, c, d) {
    const rx = b.x - a.x, ry = b.y - a.y;
    const sx = d.x - c.x, sy = d.y - c.y;
    const denominator = rx * sy - ry * sx;
    if (Math.abs(denominator) < 1e-9) return null;
    const t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / denominator;
    const u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / denominator;
    if (t <= 0.0001 || t >= 0.9999 || u <= 0.0001 || u >= 0.9999) return null;
    return { x: a.x + t * rx, y: a.y + t * ry };
  }

  // Where a hand-drawn outline crosses itself it leaves a tangle. Cut at the
  // crossing and keep the larger of the two loops.
  function removeSelfIntersections(points) {
    let ring = points.slice();
    for (let guard = 0; guard < 16; guard += 1) {
      const n = ring.length;
      if (n < 4) break;
      let cut = null;
      for (let i = 0; i < n && !cut; i += 1) {
        for (let j = i + 2; j < n; j += 1) {
          if (i === 0 && j === n - 1) continue; // adjacent across the closing edge
          const hit = segmentIntersection(ring[i], ring[(i + 1) % n], ring[j], ring[(j + 1) % n]);
          if (!hit) continue;
          const inner = [hit, ...ring.slice(i + 1, j + 1)];
          const outer = [...ring.slice(0, i + 1), hit, ...ring.slice(j + 1)];
          cut = polygonArea(inner) > polygonArea(outer) ? inner : outer;
          break;
        }
      }
      if (!cut || cut.length < 3) break;
      ring = cut;
    }
    return ring.length >= 3 ? ring : points;
  }

  function dedupePoints(points, minDistance) {
    const out = [];
    points.forEach(point => {
      const last = out[out.length - 1];
      if (!last || Math.hypot(point.x - last.x, point.y - last.y) >= minDistance) out.push(point);
    });
    return out;
  }

  // Averages out hand tremor before the shape is simplified.
  function smoothStroke(points, passes = 2) {
    let current = points;
    for (let pass = 0; pass < passes && current.length > 3; pass += 1) {
      const next = [current[0]];
      for (let i = 1; i < current.length - 1; i += 1) {
        next.push({
          x: (current[i - 1].x + current[i].x * 2 + current[i + 1].x) / 4,
          y: (current[i - 1].y + current[i].y * 2 + current[i + 1].y) / 4,
        });
      }
      next.push(current[current.length - 1]);
      current = next;
    }
    return current;
  }

  // Once the stroke has left the starting area, coming back within the snap
  // radius means "close here" — everything drawn past that point is the hand
  // overshooting and would otherwise cross the outline near the start.
  function trimToStart(points, radius) {
    if (points.length < 8) return points;
    const start = points[0];
    const away = points.findIndex(p => Math.hypot(p.x - start.x, p.y - start.y) > radius * 1.8);
    if (away === -1) return points;
    for (let i = away + 1; i < points.length; i += 1) {
      if (Math.hypot(points[i].x - start.x, points[i].y - start.y) <= radius) return points.slice(0, i);
    }
    return points;
  }

  // Ramer-Douglas-Peucker. A freehand stroke arrives as hundreds of samples;
  // this reduces it to the handful of corners that actually describe the shape,
  // so the border stays editable and the manifest stays readable.
  function simplifyPath(points, tolerance) {
    if (points.length < 3) return points.slice();
    const keep = new Uint8Array(points.length);
    keep[0] = 1;
    keep[points.length - 1] = 1;
    const stack = [[0, points.length - 1]];
    while (stack.length) {
      const [first, last] = stack.pop();
      let furthest = 0;
      let index = -1;
      for (let i = first + 1; i < last; i += 1) {
        const distance = distanceToSegment(points[i].x, points[i].y, points[first], points[last]);
        if (distance > furthest) { furthest = distance; index = i; }
      }
      if (index !== -1 && furthest > tolerance) {
        keep[index] = 1;
        stack.push([first, index], [index, last]);
      }
    }
    return points.filter((_, i) => keep[i]);
  }

  // Keeps handle counts sane no matter how slowly the outline was drawn.
  function simplifyStroke(points) {
    let tolerance = 10 / scale;
    let result = simplifyPath(points, tolerance);
    while (result.length > 120 && tolerance < 400) {
      tolerance *= 1.6;
      result = simplifyPath(points, tolerance);
    }
    return result;
  }

  function pointInPolygon(x, y, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
      const xi = points[i].x, yi = points[i].y;
      const xj = points[j].x, yj = points[j].y;
      const intersects = (yi > y) !== (yj > y) &&
        x < ((xj - xi) * (y - yi)) / (yj - yi || 1e-9) + xi;
      if (intersects) inside = !inside;
    }
    return inside;
  }

  function distanceToSegment(px, py, a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const lengthSq = dx * dx + dy * dy;
    const t = lengthSq ? clamp(((px - a.x) * dx + (py - a.y) * dy) / lengthSq, 0, 1) : 0;
    return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
  }

  function distanceToEdges(x, y, points) {
    let min = Infinity;
    for (let i = 0; i < points.length; i += 1) {
      const d = distanceToSegment(x, y, points[i], points[(i + 1) % points.length]);
      if (d < min) min = d;
    }
    return min;
  }

  function boundingBox(points) {
    const xs = points.map(p => p.x);
    const ys = points.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
  }

  function polygonArea(points) {
    let sum = 0;
    for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
      sum += (points[j].x + points[i].x) * (points[j].y - points[i].y);
    }
    return Math.abs(sum / 2);
  }

  function centroid(points) {
    const sum = points.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
    return { x: sum.x / points.length, y: sum.y / points.length };
  }

  function signedArea(points) {
    let sum = 0;
    for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
      sum += (points[j].x + points[i].x) * (points[j].y - points[i].y);
    }
    return sum / 2;
  }

  // All rings wound the same way, so a nonzero fill never punches a hole where
  // one island happens to sit inside another's bounding area.
  const windSameWay = (points) => (signedArea(points) < 0 ? points.slice().reverse() : points);

  function unionBox(boxes) {
    const minX = Math.min(...boxes.map(b => b.minX));
    const minY = Math.min(...boxes.map(b => b.minY));
    const maxX = Math.max(...boxes.map(b => b.maxX));
    const maxY = Math.max(...boxes.map(b => b.maxY));
    return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
  }

  /* ------------------------------------------- multi-part kingdom helpers */
  // A kingdom is one or more disjoint rings: a mainland plus its islands.
  const allPoints = (kingdom) => kingdom.parts.flat();
  const totalPoints = (kingdom) => kingdom.parts.reduce((n, part) => n + part.length, 0);
  const kingdomArea = (kingdom) => kingdom.parts.reduce((sum, part) => sum + polygonArea(part), 0);
  const largestPart = (kingdom) =>
    kingdom.parts.reduce((best, part) => (polygonArea(part) > polygonArea(best) ? part : best), kingdom.parts[0]);
  const insideKingdom = (kingdom, x, y) =>
    kingdom.parts.some(part => part.length >= 3 && pointInPolygon(x, y, part));

  // Approximate pole of inaccessibility: the interior point furthest from any
  // edge. Keeps names inside concave territories instead of outside them.
  function labelAnchor(points) {
    const box = boundingBox(points);
    let best = centroid(points);
    let bestDistance = pointInPolygon(best.x, best.y, points) ? distanceToEdges(best.x, best.y, points) : -1;
    let stepX = box.width / 12;
    let stepY = box.height / 12;
    for (let pass = 0; pass < 4; pass += 1) {
      const originX = pass === 0 ? box.minX : best.x - stepX * 2;
      const originY = pass === 0 ? box.minY : best.y - stepY * 2;
      const cols = pass === 0 ? 13 : 5;
      for (let ix = 0; ix <= cols; ix += 1) {
        for (let iy = 0; iy <= cols; iy += 1) {
          const x = originX + stepX * ix;
          const y = originY + stepY * iy;
          if (!pointInPolygon(x, y, points)) continue;
          const d = distanceToEdges(x, y, points);
          if (d > bestDistance) { bestDistance = d; best = { x, y }; }
        }
      }
      stepX /= 3; stepY /= 3;
    }
    return { point: best, clearance: Math.max(bestDistance, 0) };
  }

  /* ========================================================= kingdom model */

  function normaliseKingdom(raw, index) {
    const palette = PALETTE[index % PALETTE.length];
    const cleanRing = (ring) => windSameWay((Array.isArray(ring) ? ring : [])
      .map(p => ({ x: Number(p.x), y: Number(p.y) }))
      .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y)));
    // `points` is the pre-islands single-ring form and is still accepted.
    const source = Array.isArray(raw.parts) && raw.parts.length ? raw.parts : [raw.points];
    const parts = source.map(cleanRing).filter(ring => ring.length >= 3);
    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : uid("kingdom"),
      name: typeof raw.name === "string" ? raw.name : `Kingdom ${index + 1}`,
      parts,
      borderColor: /^#[0-9a-f]{6}$/i.test(raw.borderColor || "") ? raw.borderColor : palette.border,
      fillColor: /^#[0-9a-f]{6}$/i.test(raw.fillColor || "") ? raw.fillColor : palette.fill,
      fillOpacity: clamp(Number(raw.fillOpacity ?? 0.1) || 0, 0, 0.45),
      notes: typeof raw.notes === "string" ? raw.notes : "",
      rulingHouse: typeof raw.rulingHouse === "string" ? raw.rulingHouse : "",
      capitalId: typeof raw.capitalId === "string" ? raw.capitalId : "",
      hidden: raw.hidden === true,
    };
  }

  function normaliseSettlement(raw, index) {
    const type = iconLibrary[raw.type] ? raw.type : "town";
    const design = [1, 2, 3].includes(Number(raw.design)) ? Number(raw.design) : 1;
    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : `${type}-${Date.now().toString(36)}-${index}`,
      type,
      design,
      x: clamp(Number(raw.x) || 0, 0, MAP_WIDTH),
      y: clamp(Number(raw.y) || 0, 0, MAP_HEIGHT),
      width: clamp(Number(raw.width) || DEFAULT_WIDTH[type], 20, 200),
      rotation: Number(raw.rotation) || 0,
      opacity: Number(raw.opacity ?? 1),
      name: typeof raw.name === "string" ? raw.name : "",
      notes: typeof raw.notes === "string" ? raw.notes : "",
    };
  }

  // Same rule as kingdoms: a freshly exported HTML beats an older autosave.
  function readStored(key, embeddedNode, listKey) {
    let embedded = { savedAt: 0, list: [] };
    try {
      const parsed = JSON.parse(document.getElementById(embeddedNode)?.textContent || "[]");
      if (Array.isArray(parsed)) embedded = { savedAt: 0, list: parsed };
      else if (Array.isArray(parsed[listKey])) {
        embedded = { savedAt: Number(parsed.savedAt) || 0, list: parsed[listKey] };
      }
    } catch (error) { /* fall through to defaults */ }

    let stored = null;
    try {
      const parsed = JSON.parse(localStorage.getItem(key) || "null");
      if (parsed && Array.isArray(parsed[listKey])) stored = parsed;
    } catch (error) { stored = null; }

    return stored && Number(stored.savedAt) >= embedded.savedAt ? stored[listKey] : embedded.list;
  }

  function loadSettlements() {
    settlements = readStored(SETTLEMENT_STORAGE_KEY, "embeddedSettlementData", "settlements")
      .map(normaliseSettlement);
  }

  function loadKingdoms() {
    let embedded = { savedAt: 0, kingdoms: [] };
    try {
      const parsed = JSON.parse(document.getElementById("embeddedKingdomData")?.textContent || "{}");
      if (Array.isArray(parsed)) embedded = { savedAt: 0, kingdoms: parsed };
      else if (Array.isArray(parsed.kingdoms)) embedded = { savedAt: Number(parsed.savedAt) || 0, kingdoms: parsed.kingdoms };
    } catch (error) { /* fall through to defaults */ }

    let stored = null;
    try {
      const parsed = JSON.parse(localStorage.getItem(KINGDOM_STORAGE_KEY) || "null");
      if (parsed && Array.isArray(parsed.kingdoms)) stored = parsed;
    } catch (error) { stored = null; }

    // A freshly exported HTML wins over an older browser autosave.
    const source = stored && Number(stored.savedAt) >= embedded.savedAt ? stored.kingdoms : embedded.kingdoms;
    kingdoms = source.map(normaliseKingdom).filter(k => k.parts.length > 0);
  }

  let saveTimer = null;
  function persist(immediate) {
    clearTimeout(saveTimer);
    const write = () => {
      try {
        const savedAt = Date.now();
        localStorage.setItem(KINGDOM_STORAGE_KEY, JSON.stringify({ savedAt, kingdoms }));
        localStorage.setItem(SETTLEMENT_STORAGE_KEY, JSON.stringify({ savedAt, settlements }));
      } catch (error) {
        setStatus("Could not autosave to this browser");
      }
    };
    if (immediate) write();
    else saveTimer = setTimeout(write, 600);
  }

  // Snapshots carry the selection too, so undo/redo puts you back where you were.
  const snapshot = () => ({
    kingdoms: clone(kingdoms),
    settlements: clone(settlements),
    selectedId,
    selectedSettlementId,
  });

  function restore(state) {
    kingdoms = state.kingdoms;
    settlements = state.settlements;
    selectedId = kingdoms.some(k => k.id === state.selectedId) ? state.selectedId : null;
    selectedSettlementId = settlements.some(s => s.id === state.selectedSettlementId)
      ? state.selectedSettlementId : null;
    if (selectedId) openInspector(); else dom.inspector.classList.add("hidden");
    syncSettlements();
    buildCapitalOptions();
    updateSettlementManifest();
    syncSettlementInspector();
  }

  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 80) undoStack.shift();
    redoStack.length = 0;
    updateButtons();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snapshot());
    restore(undoStack.pop());
    afterChange("Undo");
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
    afterChange("Redo");
  }

  function afterChange(message) {
    render();
    updateKingdomManifest();
    syncInspector();
    updateButtons();
    persist(false);
    if (message) setStatus(message);
  }

  const byId = (id) => kingdoms.find(k => k.id === id) || null;

  /* ============================================================= rendering */

  const pathCache = new Map();

  function geometryFor(kingdom) {
    const signature = kingdom.parts
      .map(part => part.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(";"))
      .join("|");
    const cached = pathCache.get(kingdom.id);
    if (cached && cached.signature === signature) return cached;
    const seed = hashSeed(kingdom.id);
    // Every part becomes a subpath of the same fill and the same ink line, so a
    // mainland and its islands read as one territory.
    const mains = [];
    const unders = [];
    kingdom.parts.forEach((part, index) => {
      const offset = index * 1319;
      // Two passes with different seeds give the doubled-back look of a pen line.
      mains.push(smoothClosedPath(roughenPolygon(part, seed + offset, 1)));
      unders.push(smoothClosedPath(roughenPolygon(part, seed + offset + 977, 1.4)));
    });
    // The name belongs on the biggest landmass, not in the sea between parts.
    const anchor = labelAnchor(largestPart(kingdom));
    const entry = {
      signature,
      main: mains.join(" "),
      under: unders.join(" "),
      label: anchor.point,
      clearance: anchor.clearance,
      box: unionBox(kingdom.parts.map(boundingBox)),
      labelBox: boundingBox(largestPart(kingdom)),
    };
    pathCache.set(kingdom.id, entry);
    return entry;
  }

  const nodes = new Map();

  function ensureNodes(kingdom) {
    let entry = nodes.get(kingdom.id);
    if (entry) return entry;
    const fill = svgEl("path");
    fill.setAttribute("class", "kingdom-fill");
    const halo = svgEl("path");
    halo.setAttribute("class", "kingdom-line halo");
    const under = svgEl("path");
    under.setAttribute("class", "kingdom-line under");
    const main = svgEl("path");
    main.setAttribute("class", "kingdom-line main");
    const strokeGroup = svgEl("g");
    strokeGroup.append(halo, under, main);
    const label = svgEl("text");
    label.setAttribute("class", "kingdom-label");
    entry = { fill, strokeGroup, halo, under, main, label };
    nodes.set(kingdom.id, entry);

    fill.addEventListener("pointerenter", () => setHover(kingdom.id, true));
    fill.addEventListener("pointerleave", () => setHover(kingdom.id, false));
    return entry;
  }

  function setHover(id, on) {
    const entry = nodes.get(id);
    if (!entry) return;
    [entry.fill, entry.strokeGroup, entry.label].forEach(el => el.classList.toggle("is-hover", on));
  }

  function applyKingdomAttributes(el, kingdom, role) {
    el.dataset.mapEntity = "kingdom";
    el.dataset.kingdomId = kingdom.id;
    el.dataset.kingdomName = kingdom.name;
    el.dataset.rulingHouse = kingdom.rulingHouse;
    el.dataset.capitalId = kingdom.capitalId;
    el.dataset.kingdomRole = role;
    el.dataset.pointCount = String(totalPoints(kingdom));
    el.dataset.partCount = String(kingdom.parts.length);
    el.dataset.borderColor = kingdom.borderColor;
    el.dataset.fillColor = kingdom.fillColor;
    el.dataset.fillOpacity = String(kingdom.fillOpacity);
    el.classList.add("kingdom-group");
    el.classList.toggle("is-selected", kingdom.id === selectedId);
    el.classList.toggle("kingdom-hidden", kingdom.hidden);
  }

  function render() {
    const live = new Set();
    kingdoms.forEach(kingdom => {
      live.add(kingdom.id);
      const geometry = geometryFor(kingdom);
      const entry = ensureNodes(kingdom);

      entry.fill.setAttribute("d", geometry.main);
      entry.fill.setAttribute("fill", kingdom.fillColor);
      entry.fill.setAttribute("fill-opacity", String(kingdom.fillOpacity));
      applyKingdomAttributes(entry.fill, kingdom, "fill");

      entry.halo.setAttribute("d", geometry.main);
      entry.under.setAttribute("d", geometry.under);
      entry.main.setAttribute("d", geometry.main);
      [entry.halo, entry.under, entry.main].forEach(line => line.setAttribute("stroke", kingdom.borderColor));
      applyKingdomAttributes(entry.strokeGroup, kingdom, "border");

      entry.label.textContent = kingdom.name;
      entry.label.setAttribute("x", geometry.label.x.toFixed(2));
      entry.label.setAttribute("y", geometry.label.y.toFixed(2));
      entry.label.setAttribute("fill", kingdom.borderColor);
      applyKingdomAttributes(entry.label, kingdom, "label");

      dom.fills.appendChild(entry.fill);
      dom.strokes.appendChild(entry.strokeGroup);
      dom.labels.appendChild(entry.label);
    });

    nodes.forEach((entry, id) => {
      if (live.has(id)) return;
      entry.fill.remove(); entry.strokeGroup.remove(); entry.label.remove();
      nodes.delete(id);
      pathCache.delete(id);
    });

    renderHandles();
    updateLabelFit();
    updateCounts();
  }

  // Handle radii are written as numbers, not calc(var(...)): CSS variables are
  // not substituted inside SVG presentation attributes, and the `r` CSS property
  // is not reliable across browsers.
  const handleRadius = () => HANDLE_SCREEN_PX / scale;

  function renderHandles() {
    dom.handleGroup.textContent = "";
    if (mode === "move" || !selectedId) return;
    const kingdom = byId(selectedId);
    if (!kingdom || kingdom.hidden) return;
    const radius = handleRadius();

    kingdom.parts.forEach((part, partIndex) => {
      if (mode === "edit" || mode === "addpoint") {
        part.forEach((point, index) => {
          const next = part[(index + 1) % part.length];
          const mid = svgEl("circle");
          mid.setAttribute("class", "midpoint");
          mid.setAttribute("cx", ((point.x + next.x) / 2).toFixed(2));
          mid.setAttribute("cy", ((point.y + next.y) / 2).toFixed(2));
          mid.setAttribute("r", (radius * 0.62).toFixed(2));
          mid.dataset.insertAfter = String(index);
          mid.dataset.partIndex = String(partIndex);
          dom.handleGroup.appendChild(mid);
        });
      }

      part.forEach((point, index) => {
        const handle = svgEl("circle");
        handle.setAttribute("class", "vertex");
        handle.setAttribute("cx", point.x.toFixed(2));
        handle.setAttribute("cy", point.y.toFixed(2));
        handle.setAttribute("r", radius.toFixed(2));
        handle.dataset.vertexIndex = String(index);
        handle.dataset.partIndex = String(partIndex);
        dom.handleGroup.appendChild(handle);
        // Handles are rebuilt every frame of a drag; keep the grabbed one lit.
        if (drag && drag.kind === "vertex" && drag.index === index && drag.part === partIndex) {
          handle.classList.add("dragging");
          drag.el = handle;
        }
      });
    });
  }

  // True once the outline has left its start and come back to it.
  function strokeNearStart() {
    const drawn = draftPath();
    if (drawn.length < 8) return false;
    const start = drawn[0];
    const here = drawn[drawn.length - 1];
    const radius = snapRadius();
    const left = drawn.some(p => Math.hypot(p.x - start.x, p.y - start.y) > radius * 1.8);
    return left && Math.hypot(here.x - start.x, here.y - start.y) <= radius;
  }

  function renderDraft() {
    dom.draftGroup.textContent = "";
    const raw = draftPath();
    if (!raw.length) return;
    // Preview the smoothed line, not the raw samples — otherwise the outline
    // looks jagged while you draw and then changes shape when you let go.
    const points = raw.length > 4 ? smoothStroke(raw, 1) : raw;

    const armed = strokeNearStart();
    const path = svgEl("path");
    path.setAttribute("class", `draft-line${armed ? " armed" : ""}`);
    const d = points.map((p, i) => `${i ? "L" : "M"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
    // Show the closing edge once there is a shape to close.
    path.setAttribute("d", points.length > 2 ? `${d} Z` : d);
    dom.draftGroup.appendChild(path);

    // Where the outline began, and where it has to come back to.
    if (points.length > 6) {
      const target = svgEl("circle");
      target.setAttribute("class", `snap-target${armed ? " armed" : ""}`);
      target.setAttribute("cx", points[0].x.toFixed(2));
      target.setAttribute("cy", points[0].y.toFixed(2));
      target.setAttribute("r", snapRadius().toFixed(2));
      dom.draftGroup.appendChild(target);
    }

    // Between passes, mark where the next stroke will pick up from.
    if (!activeSegment && points.length > 2) {
      const resume = svgEl("circle");
      resume.setAttribute("class", "resume-point");
      resume.setAttribute("cx", points[points.length - 1].x.toFixed(2));
      resume.setAttribute("cy", points[points.length - 1].y.toFixed(2));
      resume.setAttribute("r", (handleRadius() * 1.1).toFixed(2));
      dom.draftGroup.appendChild(resume);
    }
  }

  // Shrink or hide names that no longer fit their territory on screen.
  let labelFitQueued = false;
  function updateLabelFit() {
    if (labelFitQueued) return;
    labelFitQueued = true;
    requestAnimationFrame(() => {
      labelFitQueued = false;
      kingdoms.forEach(kingdom => {
        const entry = nodes.get(kingdom.id);
        if (!entry || kingdom.hidden) return;
        const geometry = pathCache.get(kingdom.id);
        if (!geometry) return;
        entry.label.style.fontSize = "";
        const screenWidth = geometry.box.width * scale;
        if (screenWidth < 46 || !kingdom.name) {
          entry.label.style.display = "none";
          return;
        }
        entry.label.style.display = "";
        const available = Math.max(geometry.clearance * 1.85, geometry.box.width * 0.35);
        let length = 0;
        try { length = entry.label.getComputedTextLength(); } catch (error) { length = 0; }
        if (length > available && length > 0) {
          const base = LABEL_SCREEN_PX / scale;
          entry.label.style.fontSize = `${Math.max(base * 0.55, base * (available / length))}px`;
        }
      });
    });
  }

  /* ========================================================== settlements */

  function getIcon(type, design) {
    const set = iconLibrary[type] || iconLibrary.town;
    return set.find(entry => Number(entry.id) === Number(design)) || set[0];
  }

  const settlementNodes = new Map();

  // Reuses elements keyed by id: rebuilding every <img> during a drag would
  // rehydrate megabytes of inline base64 each frame.
  function syncSettlements() {
    const live = new Set();
    settlements.forEach(item => {
      live.add(item.id);
      let entry = settlementNodes.get(item.id);
      if (!entry) {
        const el = document.createElement("div");
        const img = document.createElement("img");
        el.appendChild(img);
        el.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          activateSettlement(item.id, "keyboard");
        });
        entry = { el, img, iconKey: "" };
        settlementNodes.set(item.id, entry);
      }
      const { el, img } = entry;
      const type = iconLibrary[item.type] ? item.type : "town";
      const design = [1, 2, 3].includes(Number(item.design)) ? Number(item.design) : 1;

      el.className = `settlement${item.id === selectedSettlementId ? " selected" : ""}`;
      el.dataset.mapEntity = "settlement";
      el.dataset.settlementId = item.id;
      el.dataset.settlementType = type;
      el.dataset.settlementDesign = String(design);
      el.dataset.mapX = String(item.x);
      el.dataset.mapY = String(item.y);
      el.dataset.mapAnchor = "bottom-center";
      el.dataset.settlementWidth = String(item.width);
      el.dataset.rotation = String(item.rotation || 0);
      el.dataset.settlementName = item.name || "";
      el.dataset.settlementNotes = item.notes || "";
      el.dataset.interaction = "open-settlement-detail";
      el.dataset.clickEvent = "merovar:settlement-click";
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-label", `${item.name || capitalize(type)} — ${type}`);
      el.style.left = `${item.x}px`;
      el.style.top = `${item.y}px`;
      el.style.width = `${item.width}px`;
      el.style.opacity = item.opacity ?? 1;
      el.style.transform = `translate(-50%,-100%) rotate(${item.rotation || 0}deg)`;

      const iconKey = `${type}-${design}`;
      if (entry.iconKey !== iconKey) {
        img.src = getIcon(type, design).src;
        entry.iconKey = iconKey;
      }
      img.alt = item.name || capitalize(type);
      dom.settlementLayer.appendChild(el);
    });

    settlementNodes.forEach((entry, id) => {
      if (live.has(id)) return;
      entry.el.remove();
      settlementNodes.delete(id);
    });
    updateCounts();
  }

  function updateCounts() {
    dom.countLabel.textContent =
      `${kingdoms.length} kingdom${kingdoms.length === 1 ? "" : "s"} · ${settlements.length} settlements`;
  }

  function settlementRecord(item, index) {
    const type = iconLibrary[item.type] ? item.type : "town";
    return {
      id: item.id,
      entity: "settlement",
      type,
      design: Number(item.design) || 1,
      displayName: item.name || `${capitalize(type)} ${index + 1}`,
      name: item.name || "",
      notes: item.notes || "",
      coordinates: {
        x: Number(item.x), y: Number(item.y),
        anchor: "bottom-center", mapWidth: MAP_WIDTH, mapHeight: MAP_HEIGHT,
      },
      appearance: {
        width: Number(item.width), rotation: Number(item.rotation) || 0,
        opacity: Number(item.opacity ?? 1), colorGrade: "merovar-parchment-soft-v2",
      },
      interaction: {
        clickable: true, action: "open-settlement-detail",
        event: "merovar:settlement-click", selector: `[data-settlement-id="${item.id}"]`,
      },
    };
  }

  function buildSettlementManifest() {
    const counts = {};
    const list = settlements.map((item, index) => {
      const record = settlementRecord(item, index);
      counts[record.type] = (counts[record.type] || 0) + 1;
      return record;
    });
    return {
      schema: "merovar.interactive-map.v2",
      map: { id: "merovar-world-map", width: MAP_WIDTH, height: MAP_HEIGHT, coordinateOrigin: "top-left" },
      counts,
      editable: true,
      visualGuarantee: "The map image, geography, coastlines and islands are unchanged. Settlement artwork is limited to the nine icons already embedded in this file; no new artwork is introduced.",
      integration: {
        selector: '.settlement[data-map-entity="settlement"]',
        manifestElement: "#merovarSettlementManifest",
        api: "window.MerovarMapAPI",
        clickEvent: "merovar:settlement-click",
      },
      settlements: list,
    };
  }

  function activateSettlement(id, source = "api") {
    const index = settlements.findIndex(item => item.id === id);
    if (index === -1) return null;
    const record = settlementRecord(settlements[index], index);
    window.dispatchEvent(new CustomEvent("merovar:settlement-click", { detail: { ...clone(record), source } }));
    return clone(record);
  }

  /* ====================================================== kingdom manifest */

  function settlementsInside(kingdom) {
    if (!kingdom.parts.length) return [];
    return settlements
      .map((item, index) => ({ item, index }))
      .filter(({ item }) => insideKingdom(kingdom, Number(item.x), Number(item.y)))
      .map(({ item, index }) => settlementRecord(item, index));
  }

  const round = (points) => points.map(p => ({ x: Number(p.x.toFixed(2)), y: Number(p.y.toFixed(2)) }));

  function kingdomRecord(kingdom) {
    const geometry = geometryFor(kingdom);
    const inside = settlementsInside(kingdom);
    return {
      id: kingdom.id,
      entity: "kingdom",
      name: kingdom.name,
      rulingHouse: kingdom.rulingHouse,
      capitalSettlementId: kingdom.capitalId,
      notes: kingdom.notes,
      visible: !kingdom.hidden,
      appearance: {
        borderColor: kingdom.borderColor,
        fillColor: kingdom.fillColor,
        fillOpacity: kingdom.fillOpacity,
        style: "hand-inked-parchment",
      },
      geometry: {
        pointCount: totalPoints(kingdom),
        partCount: kingdom.parts.length,
        // Every landmass of the territory. Disjoint rings, all wound the same
        // way; none of them is a hole.
        parts: kingdom.parts.map((part, index) => ({
          index,
          role: part === largestPart(kingdom) ? "mainland" : "island",
          pointCount: part.length,
          points: round(part),
          centroid: centroid(part),
          boundingBox: boundingBox(part),
          areaSquareUnits: Math.round(polygonArea(part)),
        })),
        // Kept for readers written before islands existed: the mainland ring.
        points: round(largestPart(kingdom)),
        centroid: centroid(allPoints(kingdom)),
        labelAnchor: geometry.label,
        boundingBox: geometry.box,
        areaSquareUnits: Math.round(kingdomArea(kingdom)),
        coordinateSystem: { width: MAP_WIDTH, height: MAP_HEIGHT, origin: "top-left" },
      },
      settlementsInside: { count: inside.length, ids: inside.map(s => s.id) },
      interaction: {
        clickable: true, action: "open-kingdom-detail",
        event: "merovar:kingdom-click", selector: `[data-kingdom-id="${kingdom.id}"]`,
      },
    };
  }

  function buildKingdomManifest() {
    return {
      schema: "merovar.kingdom-borders.v1",
      map: { id: "merovar-world-map", width: MAP_WIDTH, height: MAP_HEIGHT, coordinateOrigin: "top-left" },
      counts: { kingdoms: kingdoms.length },
      visualGuarantee: "Kingdom borders are an overlay only. The map image and all 94 settlements are unchanged.",
      layerOrder: ["base-map", "kingdom-fills", "kingdom-borders-and-names", "settlements", "editor-interface"],
      integration: {
        selector: '[data-map-entity="kingdom"]',
        manifestElement: "#merovarKingdomManifest",
        api: "window.MerovarKingdomAPI",
        clickEvent: "merovar:kingdom-click",
      },
      kingdoms: kingdoms.map(kingdomRecord),
    };
  }

  function updateKingdomManifest() {
    const manifest = buildKingdomManifest();
    dom.kingdomManifest.textContent = JSON.stringify(manifest).replace(/</g, "\\u003c");
    window.MEROVAR_KINGDOM_MANIFEST = clone(manifest);
    window.MEROVAR_KINGDOMS = clone(manifest.kingdoms);
    return manifest;
  }

  function updateSettlementManifest() {
    const manifest = buildSettlementManifest();
    dom.settlementManifest.textContent = JSON.stringify(manifest).replace(/</g, "\\u003c");
    window.MEROVAR_MAP_MANIFEST = clone(manifest);
    window.MEROVAR_SETTLEMENTS = clone(manifest.settlements);
    return manifest;
  }

  /* ============================================================= transform */

  function viewSize() {
    const vv = window.visualViewport;
    return { w: vv ? vv.width : window.innerWidth, h: vv ? vv.height : window.innerHeight };
  }

  function clampOffsets() {
    const { w, h } = viewSize();
    const sw = MAP_WIDTH * scale;
    const sh = MAP_HEIGHT * scale;
    offsetX = sw <= w ? (w - sw) / 2 : clamp(offsetX, w - sw, 0);
    offsetY = sh <= h ? (h - sh) / 2 : clamp(offsetY, h - sh, 0);
  }

  function applyTransform() {
    clampOffsets();
    dom.world.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
    // Ink, labels and handles are sized in map units so they stay constant on screen.
    const root = dom.world.style;
    root.setProperty("--k-ink", (INK_SCREEN_PX / scale).toFixed(3));
    root.setProperty("--k-label", (LABEL_SCREEN_PX / scale).toFixed(3));
    root.setProperty("--k-handle", (HANDLE_SCREEN_PX / scale).toFixed(3));
    // Handle radii are numeric, so they have to be redrawn when the zoom changes.
    if (selectedId && mode !== "move") renderHandles();
    if (draftPath().length) renderDraft();
    updateLabelFit();
  }

  function fitMap() {
    const { w, h } = viewSize();
    const reserve = w <= 1100 ? 64 : 0;
    const pad = w <= 700 ? 4 : 16;
    scale = Math.min((w - pad * 2) / MAP_WIDTH, (h - reserve - pad * 2) / MAP_HEIGHT);
    applyTransform();
  }

  function zoomAt(nextScale, cx, cy) {
    const clamped = clamp(nextScale, MIN_SCALE, MAX_SCALE);
    if (clamped === scale) return;
    const mapX = (cx - offsetX) / scale;
    const mapY = (cy - offsetY) / scale;
    scale = clamped;
    offsetX = cx - mapX * scale;
    offsetY = cy - mapY * scale;
    userAdjustedView = true;
    applyTransform();
  }

  function zoomCentre(factor) {
    const { w, h } = viewSize();
    zoomAt(scale * factor, w / 2, h / 2);
  }

  const toMap = (clientX, clientY) => ({
    x: clamp((clientX - offsetX) / scale, 0, MAP_WIDTH),
    y: clamp((clientY - offsetY) / scale, 0, MAP_HEIGHT),
  });

  const hitTest = (clientX, clientY) => document.elementFromPoint(clientX, clientY);

  /* ================================================================= modes */

  const MODE_LABELS = {
    move: "Move Map",
    settlement: "Add Settlement",
    draw: "Draw Kingdom",
    island: "Add Island",
    edit: "Select / Edit Border",
    addpoint: "Add Point",
    delpoint: "Delete Point",
  };

  const DRAW_MODES = ["draw", "island"];

  const MODE_HINTS = {
    move: "Drag to pan · scroll to zoom · click a settlement or kingdom for details",
    settlement: "Click the map to place the chosen artwork · click one to select · drag to move · Delete removes it",
    draw: "Drag to draw · let go to zoom or pan, then keep drawing · close on the start circle or press Finish · hold Space (or right/middle-drag) to pan · Backspace undoes the last stroke",
    island: "Draw another landmass to add to the selected kingdom · it stays part of the same territory",
    edit: "Click a kingdom to select · drag points to reshape · drag inside to move the whole border",
    addpoint: "Click a hollow midpoint handle, or anywhere on the outline, to insert a point",
    delpoint: "Click a border point to remove it (minimum three)",
  };

  function setMode(next) {
    // Picking a tool means you have finished typing in the inspector.
    if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) {
      document.activeElement.blur();
    }
    if (!DRAW_MODES.includes(next)) cancelDraft(false);
    mode = next;
    document.querySelectorAll("#toolbar .tool[data-mode]").forEach(button => {
      button.classList.toggle("active", button.dataset.mode === next);
    });
    document.body.classList.remove("mode-move", "mode-settlement", "mode-draw", "mode-island",
      "mode-edit", "mode-addpoint", "mode-delpoint");
    document.body.classList.add(`mode-${next}`);
    // Settlements should not swallow clicks that are meant for the border tools.
    document.body.classList.toggle("locked-settlements", next !== "move" && next !== "settlement");
    dom.palette.classList.toggle("hidden", next !== "settlement");
    if (next !== "settlement" && selectedSettlementId) deselectSettlement();
    dom.viewport.classList.toggle("drawing", DRAW_MODES.includes(next));
    dom.viewport.classList.toggle("picking", next === "addpoint" || next === "delpoint");
    if (DRAW_MODES.includes(next)) { draftSegments = []; activeSegment = null; renderDraft(); }
    dom.modeLabel.textContent = MODE_LABELS[next];
    setStatus(MODE_HINTS[next]);
    if (next === "island" && !selectedId) {
      setStatus("Select a kingdom first — or just draw, and it becomes a new one");
    }
    updateButtons();
    renderHandles();
  }

  function updateButtons() {
    const pending = draftPath().length;
    dom.undoButton.disabled = undoStack.length === 0;
    dom.redoButton.disabled = redoStack.length === 0;
    dom.finishButton.disabled = pending < 3;
    dom.cancelButton.disabled = pending === 0;
    dom.deleteKingdomButton.disabled = !selectedId;
  }

  let statusTimer = null;
  function setStatus(message) {
    dom.saveState.textContent = message;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { dom.saveState.textContent = MODE_HINTS[mode]; }, 4200);
  }

  /* ============================================================== drawing */

  const snapRadius = () => SNAP_SCREEN_PX / scale;
  const draftPath = () => (draftSegments || []).flat();

  // Raw samples -> trimmed at the closing point -> de-jittered -> simplified to
  // draggable corners -> untangled.
  function collectDraft() {
    let drawn = draftPath();
    if (drawn.length > 2) {
      drawn = trimToStart(drawn, snapRadius());
      drawn = smoothStroke(dedupePoints(drawn, 1.5 / scale), 2);
      drawn = simplifyStroke(drawn);
    }
    return drawn.length >= 3 ? removeSelfIntersections(drawn) : drawn;
  }

  function finishDraft() {
    const points = collectDraft();
    if (points.length < 3) {
      setStatus("Draw a bit more before finishing");
      return;
    }
    const ring = windSameWay(points.map(p => ({ x: p.x, y: p.y })));
    const target = mode === "island" ? byId(selectedId) : null;

    pushUndo();
    draftSegments = null;
    activeSegment = null;
    renderDraft();

    // Add Island mode appends the new landmass to the selected kingdom instead
    // of creating a territory of its own.
    if (target) {
      target.parts.push(ring);
      pathCache.delete(target.id);
      afterChange(`Added an island to ${target.name} — ${target.parts.length} parts`);
      openInspector();
      return;
    }

    const kingdom = normaliseKingdom({
      name: `Kingdom ${kingdoms.length + 1}`,
      parts: [ring],
    }, kingdoms.length);
    kingdoms.push(kingdom);
    selectedId = kingdom.id;
    setMode("edit");
    afterChange(`Created ${kingdom.name} — ${totalPoints(kingdom)} points`);
    openInspector();
    dom.editName.focus();
    dom.editName.select();
  }

  function cancelDraft(announce = true) {
    draftSegments = null;
    activeSegment = null;
    renderDraft();
    updateButtons();
    if (announce) setStatus("Drawing cancelled");
  }

  // Backspace: drop the last press-drag, not the whole outline.
  function undoLastSegment() {
    if (!draftSegments?.length) return;
    draftSegments.pop();
    renderDraft();
    updateButtons();
    setStatus(draftSegments.length ? "Last stroke removed" : "Outline cleared");
  }

  /* ============================================ pointer: pan, draw, reshape */

  const pointers = new Map();
  let drag = null;
  let pointerMoved = false;
  let pinch = null;

  function pinchState() {
    const [a, b] = [...pointers.values()];
    return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, dist: Math.hypot(a.x - b.x, a.y - b.y) };
  }

  dom.viewport.addEventListener("pointerdown", event => {
    // Space, middle-drag and right-drag pan in every mode, including while
    // drawing — a pan attempt must never be mistaken for a stroke.
    const middleButton = event.button === 1;
    const rightButton = event.button === 2;
    const wantsPan = middleButton || rightButton || spaceHeld;
    if (event.pointerType === "mouse" && ![0, 1, 2].includes(event.button)) return;
    // Touching the map hands the keyboard back to it, so Space, Backspace and
    // the other shortcuts work straight after typing a kingdom name.
    if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) {
      document.activeElement.blur();
    }
    try { dom.viewport.setPointerCapture(event.pointerId); } catch (error) { /* synthetic pointer */ }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    pointerMoved = false;

    if (pointers.size === 2) {
      const { cx, cy, dist } = pinchState();
      pinch = { dist: dist || 1, scale, mapX: (cx - offsetX) / scale, mapY: (cy - offsetY) / scale };
      drag = null;
      // A second finger means "pinch to zoom", not "keep drawing".
      if (activeSegment) {
        draftSegments.pop();
        activeSegment = null;
        renderDraft();
        updateButtons();
      }
      return;
    }

    const base = { clientStartX: event.clientX, clientStartY: event.clientY };

    if (DRAW_MODES.includes(mode) && !wantsPan) {
      // Start a new pass of the outline. Releasing does not close it unless you
      // are back at the start, so pausing to zoom or pan costs nothing.
      draftSegments = draftSegments || [];
      activeSegment = [toMap(event.clientX, event.clientY)];
      draftSegments.push(activeSegment);
      drag = { ...base, kind: "freehand" };
      renderDraft();
      return;
    }

    const target = hitTest(event.clientX, event.clientY);

    if (mode === "settlement" && !wantsPan) {
      const el = target?.closest('[data-map-entity="settlement"]');
      if (el) {
        const item = settlementById(el.dataset.settlementId);
        if (item) {
          selectSettlement(item.id);
          drag = {
            ...base, kind: "settlement", id: item.id,
            startX: item.x, startY: item.y, snapshotTaken: false,
          };
          return;
        }
      }
    }

    const vertex = target?.closest(".vertex[data-vertex-index]");
    if (vertex && mode === "edit" && !wantsPan) {
      drag = {
        ...base, kind: "vertex",
        part: Number(vertex.dataset.partIndex),
        index: Number(vertex.dataset.vertexIndex),
        snapshotTaken: false, el: vertex,
      };
      vertex.classList.add("dragging");
      return;
    }

    if (mode === "edit" && selectedId && !wantsPan) {
      const fill = target?.closest('.kingdom-fill[data-kingdom-id]');
      if (fill && fill.dataset.kingdomId === selectedId) {
        const start = toMap(event.clientX, event.clientY);
        drag = {
          ...base,
          kind: "kingdom",
          startX: start.x, startY: start.y,
          origin: byId(selectedId).parts.map(part => part.map(p => ({ ...p }))),
          snapshotTaken: false,
        };
        return;
      }
    }

    drag = { ...base, kind: "pan", startX: event.clientX, startY: event.clientY, offsetX, offsetY };
    dom.viewport.classList.add("dragging");
  });

  dom.viewport.addEventListener("pointermove", event => {
    if (pointers.has(event.pointerId)) pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointers.size === 2 && pinch) {
      const { cx, cy, dist } = pinchState();
      scale = clamp(pinch.scale * (dist / pinch.dist), MIN_SCALE, MAX_SCALE);
      offsetX = cx - pinch.mapX * scale;
      offsetY = cy - pinch.mapY * scale;
      userAdjustedView = true;
      pointerMoved = true;
      applyTransform();
      return;
    }

    if (drag?.kind === "freehand" && activeSegment) {
      pointerMoved = true;
      const point = toMap(event.clientX, event.clientY);
      const last = activeSegment[activeSegment.length - 1];
      // Sample every few screen pixels rather than every event.
      if (Math.hypot(point.x - last.x, point.y - last.y) > 3.5 / scale) {
        activeSegment.push(point);
        renderDraft();
      }
      return;
    }

    if (!drag) return;
    if (Math.abs(event.clientX - drag.clientStartX) > 3 ||
        Math.abs(event.clientY - drag.clientStartY) > 3) pointerMoved = true;

    if (drag.kind === "pan") {
      offsetX = drag.offsetX + (event.clientX - drag.startX);
      offsetY = drag.offsetY + (event.clientY - drag.startY);
      userAdjustedView = true;
      applyTransform();
      return;
    }

    if (drag.kind === "settlement") {
      const item = settlementById(drag.id);
      if (!item) return;
      if (!drag.snapshotTaken) { pushUndo(); drag.snapshotTaken = true; }
      const current = toMap(event.clientX, event.clientY);
      item.x = clamp(current.x, 0, MAP_WIDTH);
      item.y = clamp(current.y, 0, MAP_HEIGHT);
      syncSettlements();
      return;
    }

    const kingdom = byId(selectedId);
    if (!kingdom) return;

    if (drag.kind === "vertex") {
      if (!drag.snapshotTaken) { pushUndo(); drag.snapshotTaken = true; }
      const point = toMap(event.clientX, event.clientY);
      if (kingdom.parts[drag.part]) kingdom.parts[drag.part][drag.index] = point;
      render();
      return;
    }

    if (drag.kind === "kingdom") {
      if (!drag.snapshotTaken) { pushUndo(); drag.snapshotTaken = true; }
      const current = toMap(event.clientX, event.clientY);
      const dx = current.x - drag.startX;
      const dy = current.y - drag.startY;
      // Islands travel with the mainland.
      kingdom.parts = drag.origin.map(part => part.map(p => ({
        x: clamp(p.x + dx, 0, MAP_WIDTH),
        y: clamp(p.y + dy, 0, MAP_HEIGHT),
      })));
      render();
    }
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;

    if (drag?.kind === "freehand") {
      drag = null;
      dom.viewport.classList.remove("dragging");
      // A tap or a twitch is not a stroke — drop it rather than leaving a stub.
      if (activeSegment && activeSegment.length < 3) draftSegments.pop();
      activeSegment = null;
      // Only closes if you came back to the start; otherwise the outline stays
      // open so you can zoom, pan, and carry on drawing it.
      if (strokeNearStart()) { finishDraft(); return; }
      renderDraft();
      updateButtons();
      const total = draftPath().length;
      if (total) setStatus(total > 8
        ? "Keep drawing, or return to the circle to close · Finish closes it now"
        : "Keep drawing round the area");
      return;
    }

    if (drag?.el) drag.el.classList.remove("dragging");
    if (drag?.kind === "settlement" && drag.snapshotTaken) {
      afterSettlementChange("Settlement moved");
    }
    if (drag && (drag.kind === "vertex" || drag.kind === "kingdom") && drag.snapshotTaken) {
      afterChange(drag.kind === "vertex" ? "Point moved" : "Border moved");
    }
    if (pointers.size === 0) {
      drag = null;
      dom.viewport.classList.remove("dragging");
    }
  }
  dom.viewport.addEventListener("pointerup", endPointer);
  dom.viewport.addEventListener("pointercancel", endPointer);

  dom.viewport.addEventListener("click", event => {
    if (pointerMoved) return;
    // Pointer capture can retarget the click at the viewport, so hit-test by
    // coordinate rather than trusting event.target.
    const target = hitTest(event.clientX, event.clientY);
    const point = toMap(event.clientX, event.clientY);

    if (DRAW_MODES.includes(mode)) return; // drawing is a drag; a click means nothing here

    if (mode === "settlement") {
      const el = target?.closest('[data-map-entity="settlement"]');
      // Clicking one selects it (handled on pointerdown); empty map places a new one.
      if (!el) placeSettlement(point);
      return;
    }
    if (mode === "edit" && target?.closest(".vertex[data-vertex-index]")) return;

    if (mode === "delpoint" && selectedId) {
      const vertex = target?.closest(".vertex[data-vertex-index]");
      if (vertex) {
        deletePoint(Number(vertex.dataset.partIndex), Number(vertex.dataset.vertexIndex));
        return;
      }
    }

    if ((mode === "addpoint" || mode === "edit") && selectedId) {
      const mid = target?.closest(".midpoint[data-insert-after]");
      if (mid) {
        insertPoint(Number(mid.dataset.partIndex), Number(mid.dataset.insertAfter), point);
        return;
      }
      if (mode === "addpoint") { insertPointNearest(point); return; }
    }

    const kingdomEl = target?.closest('[data-map-entity="kingdom"]');
    if (kingdomEl) {
      selectKingdom(kingdomEl.dataset.kingdomId, "click");
      return;
    }

    const settlementEl = target?.closest('[data-map-entity="settlement"]');
    if (settlementEl) {
      activateSettlement(settlementEl.dataset.settlementId, "click");
      const record = settlements.find(item => item.id === settlementEl.dataset.settlementId);
      if (record) setStatus(`${capitalize(record.type)} at ${Math.round(record.x)}, ${Math.round(record.y)}`);
      return;
    }

    if (mode === "edit" || mode === "move") deselect();
  });

  dom.viewport.addEventListener("dblclick", event => {
    if (DRAW_MODES.includes(mode)) { finishDraft(); return; }
    if (!hitTest(event.clientX, event.clientY)?.closest('[data-map-entity="kingdom"]')) {
      zoomAt(scale * 1.6, event.clientX, event.clientY);
    }
  });

  dom.viewport.addEventListener("wheel", event => {
    event.preventDefault();
    zoomAt(scale * Math.exp(-event.deltaY * 0.00115), event.clientX, event.clientY);
  }, { passive: false });

  /* ======================================================== point editing */

  function insertPoint(partIndex, afterIndex, point) {
    const kingdom = byId(selectedId);
    if (!kingdom?.parts[partIndex]) return;
    pushUndo();
    kingdom.parts[partIndex].splice(afterIndex + 1, 0, point);
    afterChange("Point added");
  }

  function insertPointNearest(point) {
    const kingdom = byId(selectedId);
    if (!kingdom) return;
    let best = null;
    let bestDistance = Infinity;
    kingdom.parts.forEach((part, partIndex) => {
      part.forEach((p, index) => {
