    const base = { clientStartX: event.clientX, clientStartY: event.clientY };

    if (DRAW_MODES.includes(mode) && !wantsPan) {
      // Start a new pass of the outline. Releasing does not close it unless you
      // are back at the start, so pausing to zoom or pan costs nothing.
      draftSegments = draftSegments || [];
      activeSegment = [toMap(event.clientX, event.clientY)];
      draftSegments.push(activeSegment);
      drag = { ...base, kind: "freehand" };
      renderDraft();
      return;
    }

    const target = hitTest(event.clientX, event.clientY);

    if (mode === "settlement" && !wantsPan) {
      const el = target?.closest('[data-map-entity="settlement"]');
      if (el) {
        const item = settlementById(el.dataset.settlementId);
        if (item) {
          selectSettlement(item.id);
          drag = {
            ...base, kind: "settlement", id: item.id,
            startX: item.x, startY: item.y, snapshotTaken: false,
          };
          return;
        }
      }
    }

    const vertex = target?.closest(".vertex[data-vertex-index]");
    if (vertex && mode === "edit" && !wantsPan) {
      drag = {
        ...base, kind: "vertex",
        part: Number(vertex.dataset.partIndex),
        index: Number(vertex.dataset.vertexIndex),
        snapshotTaken: false, el: vertex,
      };
      vertex.classList.add("dragging");
      return;
    }

    if (mode === "edit" && selectedId && !wantsPan) {
      const fill = target?.closest('.kingdom-fill[data-kingdom-id]');
      if (fill && fill.dataset.kingdomId === selectedId) {
        const start = toMap(event.clientX, event.clientY);
        drag = {
          ...base,
          kind: "kingdom",
          startX: start.x, startY: start.y,
          origin: byId(selectedId).parts.map(part => part.map(p => ({ ...p }))),
          snapshotTaken: false,
        };
        return;
      }
    }

    drag = { ...base, kind: "pan", startX: event.clientX, startY: event.clientY, offsetX, offsetY };
    dom.viewport.classList.add("dragging");
  });

  dom.viewport.addEventListener("pointermove", event => {
    if (pointers.has(event.pointerId)) pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (pointers.size === 2 && pinch) {
      const { cx, cy, dist } = pinchState();
      scale = clamp(pinch.scale * (dist / pinch.dist), MIN_SCALE, MAX_SCALE);
      offsetX = cx - pinch.mapX * scale;
      offsetY = cy - pinch.mapY * scale;
      userAdjustedView = true;
      pointerMoved = true;
      requestTransform();
      return;
    }

    if (drag?.kind === "freehand" && activeSegment) {
      pointerMoved = true;
      // The browser delivers one pointermove per frame but the digitiser
      // samples far faster. Coalesced events are the real path the hand took —
      // without them a quick stroke is decimated to ~60 points a second.
      const moves = typeof event.getCoalescedEvents === "function"
        ? event.getCoalescedEvents() : [event];
      const spacing = sampleSpacing();
      let added = false;
      for (const move of (moves.length ? moves : [event])) {
        const point = toMap(move.clientX, move.clientY);
        const last = activeSegment[activeSegment.length - 1];
        // Sampling has to be finer than the detail setting or precision is lost
        // before simplification ever runs.
        if (Math.hypot(point.x - last.x, point.y - last.y) > spacing) {
          activeSegment.push(point);
          added = true;
        }
      }
      if (added) {
        renderDraft();
        reportDrawing();
      }
      return;
    }

    if (!drag) return;
    if (Math.abs(event.clientX - drag.clientStartX) > 3 ||
        Math.abs(event.clientY - drag.clientStartY) > 3) pointerMoved = true;

    if (drag.kind === "pan") {
      offsetX = drag.offsetX + (event.clientX - drag.startX);
      offsetY = drag.offsetY + (event.clientY - drag.startY);
      userAdjustedView = true;
      requestTransform();
      return;
    }

    if (drag.kind === "settlement") {
      const item = settlementById(drag.id);
      if (!item) return;
      if (!drag.snapshotTaken) { pushUndo(); drag.snapshotTaken = true; }
      const current = toMap(event.clientX, event.clientY);
      item.x = clamp(current.x, 0, MAP_WIDTH);
      item.y = clamp(current.y, 0, MAP_HEIGHT);
      // Only the dragged icon moves; rewriting all 94 every frame was wasteful.
      const node = settlementNodes.get(item.id);
      if (node) {
        node.el.style.left = `${item.x}px`;
        node.el.style.top = `${item.y}px`;
        node.el.dataset.mapX = String(item.x);
        node.el.dataset.mapY = String(item.y);
      } else {
        syncSettlements();
      }
      return;
    }

    const kingdom = byId(selectedId);
    if (!kingdom) return;

    if (drag.kind === "vertex") {
      if (!drag.snapshotTaken) { pushUndo(); drag.snapshotTaken = true; }
      const cursor = toMap(event.clientX, event.clientY);
      // Shift drags at quarter speed for placing a point exactly. Re-anchoring
      // whenever Shift changes means neither entering nor leaving fine mode
      // makes the point jump.
      const fine = event.shiftKey;
      if (drag.fine !== fine) {
        drag.fine = fine;
        drag.anchorPoint = { ...kingdom.parts[drag.part][drag.index] };
        drag.anchorCursor = cursor;
      }
      const rate = fine ? 0.25 : 1;
      const point = {
        x: clamp(drag.anchorPoint.x + (cursor.x - drag.anchorCursor.x) * rate, 0, MAP_WIDTH),
        y: clamp(drag.anchorPoint.y + (cursor.y - drag.anchorCursor.y) * rate, 0, MAP_HEIGHT),
      };
      if (kingdom.parts[drag.part]) kingdom.parts[drag.part][drag.index] = point;
      render();
      dom.saveState.textContent = `Point ${drag.index + 1} · ${point.x.toFixed(1)}, ${point.y.toFixed(1)}`;
      return;
    }

    if (drag.kind === "kingdom") {
      if (!drag.snapshotTaken) { pushUndo(); drag.snapshotTaken = true; }
      const current = toMap(event.clientX, event.clientY);
      const dx = current.x - drag.startX;
      const dy = current.y - drag.startY;
      // Islands travel with the mainland.
      kingdom.parts = drag.origin.map(part => part.map(p => ({
        x: clamp(p.x + dx, 0, MAP_WIDTH),
        y: clamp(p.y + dy, 0, MAP_HEIGHT),
      })));
      render();
    }
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;

    if (drag?.kind === "freehand") {
      drag = null;
      dom.viewport.classList.remove("dragging");
      // A tap or a twitch is not a stroke — drop it rather than leaving a stub.
      if (activeSegment && activeSegment.length < 3) draftSegments.pop();
      activeSegment = null;
      // Only closes if you came back to the start; otherwise the outline stays
      // open so you can zoom, pan, and carry on drawing it.
      if (strokeNearStart()) { finishDraft(); return; }
      renderDraft();
      updateButtons();
      const total = draftPath().length;
      if (total) setStatus(total > 8
        ? "Keep drawing, or return to the circle to close · Finish closes it now"
        : "Keep drawing round the area");
      return;
    }

    if (drag?.el) drag.el.classList.remove("dragging");
    if (drag?.kind === "settlement" && drag.snapshotTaken) {
      afterSettlementChange("Settlement moved");
    }
    if (drag && (drag.kind === "vertex" || drag.kind === "kingdom") && drag.snapshotTaken) {
      afterChange(drag.kind === "vertex" ? "Point moved" : "Border moved");
    }
    if (pointers.size === 0) {
      drag = null;
      dom.viewport.classList.remove("dragging");
    }
  }
  dom.viewport.addEventListener("pointerup", endPointer);
  dom.viewport.addEventListener("pointercancel", endPointer);

  dom.viewport.addEventListener("click", event => {
    if (pointerMoved) return;
    // Pointer capture can retarget the click at the viewport, so hit-test by
    // coordinate rather than trusting event.target.
    const target = hitTest(event.clientX, event.clientY);
    const point = toMap(event.clientX, event.clientY);

    if (DRAW_MODES.includes(mode)) return; // drawing is a drag; a click means nothing here

    if (mode === "settlement") {
      const el = target?.closest('[data-map-entity="settlement"]');
      // Clicking one selects it (handled on pointerdown); empty map places a new one.
      if (!el) placeSettlement(point);
      return;
    }
    if (mode === "edit" && target?.closest(".vertex[data-vertex-index]")) return;

    if (mode === "delpoint" && selectedId) {
      const vertex = target?.closest(".vertex[data-vertex-index]");
      if (vertex) {
        deletePoint(Number(vertex.dataset.partIndex), Number(vertex.dataset.vertexIndex));
        return;
      }
    }

    if ((mode === "addpoint" || mode === "edit") && selectedId) {
      const mid = target?.closest(".midpoint[data-insert-after]");
      if (mid) {
        insertPoint(Number(mid.dataset.partIndex), Number(mid.dataset.insertAfter), point);
        return;
      }
      if (mode === "addpoint") { insertPointNearest(point); return; }
    }

    const kingdomEl = target?.closest('[data-map-entity="kingdom"]');
    if (kingdomEl) {
      activateKingdom(kingdomEl.dataset.kingdomId, "click");
      return;
    }

    const settlementEl = target?.closest('[data-map-entity="settlement"]');
    if (settlementEl) {
      activateSettlement(settlementEl.dataset.settlementId, "click");
      const record = settlements.find(item => item.id === settlementEl.dataset.settlementId);
      if (record) setStatus(`${capitalize(record.type)} at ${Math.round(record.x)}, ${Math.round(record.y)}`);
      return;
    }

    if (mode === "edit" || mode === "move") deselect();
  });

  dom.viewport.addEventListener("dblclick", event => {
    if (DRAW_MODES.includes(mode)) { finishDraft(); return; }
    if (!hitTest(event.clientX, event.clientY)?.closest('[data-map-entity="kingdom"]')) {
      zoomBy(2, event.clientX, event.clientY);
    }
  });

  dom.viewport.addEventListener("wheel", event => {
    event.preventDefault();
    // deltaMode 1 is lines and 2 is pages; without this a browser reporting
    // lines zooms by a few thousandths per notch and feels broken.
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewSize().h : 1;
    const dx = event.deltaX * unit;
    const dy = event.deltaY * unit;

    // A trackpad pinch arrives as ctrl+wheel, a sideways swipe as deltaX.
    // Both should move the map rather than zoom it.
    const panning = !event.ctrlKey && !event.metaKey &&
      (event.shiftKey || Math.abs(dx) > Math.abs(dy));
    if (panning) {
      offsetX -= dx;
      offsetY -= dy;
      userAdjustedView = true;
      requestTransform();
      return;
    }
    // A mouse notch arrives as one big delta and should cover real ground; a
    // trackpad sends a stream of small ones and needs fine continuous control.
    const notches = Math.abs(dy) >= 40 ? Math.min(Math.abs(dy) / 100, 3) : 0;
    const factor = notches
      ? Math.pow(1.4, notches * (dy < 0 ? 1 : -1))
      : Math.exp(-dy * 0.0042);
    zoomBy(factor, event.clientX, event.clientY);
  }, { passive: false });

  /* ======================================================== point editing */

  function insertPoint(partIndex, afterIndex, point) {
    const kingdom = byId(selectedId);
    if (!kingdom?.parts[partIndex]) return;
    pushUndo();
    kingdom.parts[partIndex].splice(afterIndex + 1, 0, point);
    afterChange("Point added");
  }

  function insertPointNearest(point) {
    const kingdom = byId(selectedId);
    if (!kingdom) return;
    let best = null;
    let bestDistance = Infinity;
    kingdom.parts.forEach((part, partIndex) => {
      part.forEach((p, index) => {
        const d = distanceToSegment(point.x, point.y, p, part[(index + 1) % part.length]);
        if (d < bestDistance) { bestDistance = d; best = { partIndex, index }; }
      });
    });
    // Far-away clicks would drag a spike out of the outline.
    if (!best || bestDistance > 34 / scale) {
      setStatus("Click closer to the outline to insert a point");
      return;
    }
    insertPoint(best.partIndex, best.index, point);
  }

  function deletePoint(partIndex, index) {
    const kingdom = byId(selectedId);
    const part = kingdom?.parts[partIndex];
    if (!part) return;
    // A part below three points is no longer a shape: drop the whole island.
    if (part.length <= 3) {
      if (kingdom.parts.length === 1) {
        setStatus("A kingdom needs at least three points");
        return;
      }
      pushUndo();
      kingdom.parts.splice(partIndex, 1);
      afterChange("Island removed");
      return;
    }
    pushUndo();
    part.splice(index, 1);
    afterChange("Point removed");
  }

  /* ============================================================= selection */

  function selectKingdom(id, source = "api") {
    const kingdom = byId(id);
    if (!kingdom) return null;
    selectedId = id;
    render();
    openInspector();
    updateButtons();
    const record = kingdomRecord(kingdom);
    window.dispatchEvent(new CustomEvent("merovar:kingdom-click", { detail: { ...clone(record), source } }));
    setStatus(`${kingdom.name} — ${record.settlementsInside.count} settlements inside`);
    return clone(record);
  }

  // One entry point for click, Enter and Space, so the keyboard and the mouse
  // cannot drift apart. The showcase opens its plate; the editor selects.
  function activateKingdom(id, source = "api", trigger = null) {
    const kingdom = byId(id);
    if (!kingdom) return null;
    // Editing modes keep the editor's own selection behaviour; everywhere else
    // an activation means "tell me about this realm".
    if (!presenting) return selectKingdom(id, source);
    window.dispatchEvent(new CustomEvent("merovar:kingdom-click",
      { detail: { ...clone(kingdomRecord(kingdom)), source } }));
    showKingdomPanel(id, trigger);
    return clone(kingdomRecord(kingdom));
  }

  function deselect() {
    selectedId = null;
    dom.inspector.classList.add("hidden");
    render();
    updateButtons();
  }

  function openInspector() {
    const kingdom = byId(selectedId);
    if (!kingdom) { dom.inspector.classList.add("hidden"); return; }
    dom.inspector.classList.remove("hidden");
    syncInspector();
  }

  function syncInspector() {
    const kingdom = byId(selectedId);
    if (!kingdom) { dom.inspector.classList.add("hidden"); return; }
    const record = kingdomRecord(kingdom);
    const parts = kingdom.parts.length;
    dom.inspectorTitle.textContent = kingdom.name || "Kingdom";
    dom.inspectorMeta.textContent =
      `${totalPoints(kingdom)} points · ${parts === 1 ? "one landmass" : `${parts} landmasses`} · ` +
      `${record.settlementsInside.count} settlements inside · ` +
      `${(record.geometry.areaSquareUnits / 1000).toFixed(0)}k sq units`;
    // Absorbing a kingdom keeps its shape but folds it into this territory.
    dom.mergeKingdom.innerHTML = '<option value="">Choose a kingdom…</option>';
    kingdoms.filter(other => other.id !== kingdom.id).forEach(other => {
      const option = document.createElement("option");
      option.value = other.id;
      option.textContent = `${other.name} (${other.parts.length} part${other.parts.length === 1 ? "" : "s"})`;
      dom.mergeKingdom.appendChild(option);
    });
    dom.mergeKingdom.value = "";
    dom.mergeKingdom.disabled = kingdoms.length < 2;
    if (document.activeElement !== dom.editName) dom.editName.value = kingdom.name;
    if (document.activeElement !== dom.editHouse) dom.editHouse.value = kingdom.rulingHouse;
    if (document.activeElement !== dom.editNotes) dom.editNotes.value = kingdom.notes;
    dom.editCapital.value = kingdom.capitalId;
    dom.editBorderColor.value = kingdom.borderColor;
    dom.editFillColor.value = kingdom.fillColor;
    dom.editFillOpacity.value = String(kingdom.fillOpacity);
    dom.fillOpacityValue.textContent = `${Math.round(kingdom.fillOpacity * 100)}%`;
  }

  /* ================================================ settlement placement */

  let selectedSettlementId = null;
  let paletteType = "town";
  let paletteDesign = 1;

  const settlementById = (id) => settlements.find(item => item.id === id) || null;

  function afterSettlementChange(message) {
    forgetHoldings();
    syncSettlements();
    updateSettlementManifest();
    updateKingdomManifest(); // settlement counts inside kingdoms may have moved
    buildCapitalOptions();
    syncSettlementInspector();
    updateButtons();
    persist(false);
    if (message) setStatus(message);
  }

  // Thumbnails come straight from the embedded icon library — the same nine
  // images already on the map. No new artwork is ever introduced.
  function renderPalette() {
    dom.designGrid.textContent = "";
    (iconLibrary[paletteType] || []).forEach(icon => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `design-option${Number(icon.id) === paletteDesign ? " active" : ""}`;
      button.dataset.design = String(icon.id);
      const img = document.createElement("img");
      img.src = icon.src;
      img.alt = `${capitalize(paletteType)} design ${icon.id}`;
      const number = document.createElement("span");
      number.className = "design-number";
      number.textContent = String(icon.id);
      button.append(img, number);
      button.addEventListener("click", () => {
        paletteDesign = Number(icon.id);
        renderPalette();
      });
      dom.designGrid.appendChild(button);
    });
    document.querySelectorAll("#palette .type-tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.type === paletteType);
    });
    dom.newSize.value = String(DEFAULT_WIDTH[paletteType]);
    dom.newSizeValue.textContent = `${dom.newSize.value} px`;
  }

  function placeSettlement(point) {
    pushUndo();
    const item = normaliseSettlement({
      id: uid(paletteType),
      type: paletteType,
      design: paletteDesign,
      x: point.x,
      y: point.y,
      width: Number(dom.newSize.value) || DEFAULT_WIDTH[paletteType],
    }, settlements.length);
    settlements.push(item);
    selectedSettlementId = item.id;
    afterSettlementChange(`Placed a ${item.type}`);
    openSettlementInspector();
  }

  function selectSettlement(id) {
    selectedSettlementId = id;
    syncSettlements();
    openSettlementInspector();
    updateButtons();
  }

  function deselectSettlement() {
    selectedSettlementId = null;
    dom.settlementInspector.classList.add("hidden");
    syncSettlements();
    updateButtons();
  }

  function openSettlementInspector() {
    if (!settlementById(selectedSettlementId)) {
      dom.settlementInspector.classList.add("hidden");
      return;
    }
    dom.settlementInspector.classList.remove("hidden");
    syncSettlementInspector();
  }

  function syncSettlementInspector() {
    const item = settlementById(selectedSettlementId);
    if (!item) { dom.settlementInspector.classList.add("hidden"); return; }
    const index = settlements.filter(s => s.type === item.type).indexOf(item) + 1;
    dom.settlementTitle.textContent = item.name || `${capitalize(item.type)} ${index}`;
    dom.settlementMeta.textContent =
      `${capitalize(item.type)} · design ${item.design} · ${Math.round(item.x)}, ${Math.round(item.y)}`;
    if (document.activeElement !== dom.sName) dom.sName.value = item.name;
    if (document.activeElement !== dom.sNotes) dom.sNotes.value = item.notes;
    if (document.activeElement !== dom.sWidth) dom.sWidth.value = String(Math.round(item.width));
    if (document.activeElement !== dom.sRotation) dom.sRotation.value = String(item.rotation || 0);
    if (document.activeElement !== dom.sHouse) dom.sHouse.value = item.rulingHouse;
    if (document.activeElement !== dom.sPopulation) {
      dom.sPopulation.value = item.population === null ? "" : String(item.population);
    }
    if (document.activeElement !== dom.sSoldiers) {
      dom.sSoldiers.value = item.soldiers === null ? "" : String(item.soldiers);
    }
    dom.sType.value = item.type;
    refreshHouseNames();

    dom.sDesignGrid.textContent = "";
    (iconLibrary[item.type] || []).forEach(icon => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `design-mini${Number(icon.id) === Number(item.design) ? " active" : ""}`;
      const img = document.createElement("img");
      img.src = icon.src;
      img.alt = `Design ${icon.id}`;
      button.appendChild(img);
      button.addEventListener("click", () => {
        pushUndo();
        item.design = Number(icon.id);
        afterSettlementChange("Design changed");
      });
      dom.sDesignGrid.appendChild(button);
    });
  }

  // Houses already in use, so the same name is not retyped three ways.
  function refreshHouseNames() {
    const names = new Set();
    kingdoms.forEach(k => { if (k.rulingHouse) names.add(k.rulingHouse); });
    settlements.forEach(s => { if (s.rulingHouse) names.add(s.rulingHouse); });
    const list = document.getElementById("houseNames");
    const current = [...list.options].map(o => o.value).join("|");
    const next = [...names].sort();
    if (current === next.join("|")) return;
    list.textContent = "";
    next.forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      list.appendChild(option);
    });
  }

  function duplicateSettlement() {
    const item = settlementById(selectedSettlementId);
    if (!item) return;
    pushUndo();
    const copy = normaliseSettlement({
      ...clone(item),
      id: uid(item.type),
      x: clamp(item.x + 60, 0, MAP_WIDTH),
      y: clamp(item.y + 40, 0, MAP_HEIGHT),
    }, settlements.length);
    settlements.push(copy);
    selectedSettlementId = copy.id;
    afterSettlementChange("Settlement duplicated");
    openSettlementInspector();
  }

  function deleteSettlement() {
    const item = settlementById(selectedSettlementId);
    if (!item) return;
    pushUndo();
    settlements = settlements.filter(s => s.id !== item.id);
    selectedSettlementId = null;
    dom.settlementInspector.classList.add("hidden");
    afterSettlementChange("Settlement deleted");
  }

  function buildCapitalOptions() {
    const previous = dom.editCapital.value;
    dom.editCapital.innerHTML = '<option value="">None</option>';
    const counters = {};
    settlements.forEach(item => {
      const type = iconLibrary[item.type] ? item.type : "town";
      counters[type] = (counters[type] || 0) + 1;
      const option = document.createElement("option");
      option.value = item.id;
      option.textContent = `${capitalize(type)} ${counters[type]} · ${Math.round(item.x)}, ${Math.round(item.y)}`;
      dom.editCapital.appendChild(option);
    });
    // Keep the chosen capital selected when the list is rebuilt.
    if (settlements.some(item => item.id === previous)) dom.editCapital.value = previous;
  }

  function editField(input, apply, snapshot = true) {
    let pending = false;
    input.addEventListener("input", () => {
      const kingdom = byId(selectedId);
      if (!kingdom) return;
      if (snapshot && !pending) { pushUndo(); pending = true; }
      apply(kingdom, input.value);
      render();
      updateKingdomManifest();
      syncInspector();
      persist(false);
    });
    input.addEventListener("change", () => { pending = false; });
    input.addEventListener("blur", () => { pending = false; });
  }

  editField(dom.editName, (k, v) => { k.name = v; });
  editField(dom.editHouse, (k, v) => { k.rulingHouse = v; });
  editField(dom.editNotes, (k, v) => { k.notes = v; });
  editField(dom.editBorderColor, (k, v) => { k.borderColor = v; });
  editField(dom.editFillColor, (k, v) => { k.fillColor = v; });
  editField(dom.editFillOpacity, (k, v) => { k.fillOpacity = clamp(Number(v) || 0, 0, 0.45); });
  function settlementField(input, apply, snapshot = true) {
    let pending = false;
    input.addEventListener("input", () => {
      const item = settlementById(selectedSettlementId);
      if (!item) return;
      if (snapshot && !pending) { pushUndo(); pending = true; }
      apply(item, input.value);
      afterSettlementChange(null);
    });
    input.addEventListener("change", () => { pending = false; });
    input.addEventListener("blur", () => { pending = false; });
  }

  settlementField(dom.sName, (item, value) => { item.name = value; });
  settlementField(dom.sHouse, (item, value) => { item.rulingHouse = value; });
  settlementField(dom.sPopulation, (item, value) => { item.population = countOrNull(value); });
  settlementField(dom.sSoldiers, (item, value) => { item.soldiers = countOrNull(value); });
  settlementField(dom.sNotes, (item, value) => { item.notes = value; });
  settlementField(dom.sWidth, (item, value) => { item.width = clamp(Number(value) || item.width, 20, 200); });
  settlementField(dom.sRotation, (item, value) => { item.rotation = clamp(Number(value) || 0, -180, 180); });
  dom.sType.addEventListener("change", () => {
    const item = settlementById(selectedSettlementId);
    if (!item) return;
    pushUndo();
    item.type = iconLibrary[dom.sType.value] ? dom.sType.value : "town";
    // Designs are per type; fall back to the first if this one has no match.
    if (!getIcon(item.type, item.design)) item.design = 1;
    afterSettlementChange("Type changed");
  });
  document.getElementById("sDuplicate").addEventListener("click", duplicateSettlement);
  document.getElementById("sDelete").addEventListener("click", deleteSettlement);
  document.getElementById("sClose").addEventListener("click", deselectSettlement);

  document.querySelectorAll("#palette .type-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      paletteType = tab.dataset.type;
      paletteDesign = 1;
      renderPalette();
    });
  });
  dom.newSize.addEventListener("input", () => {
    dom.newSizeValue.textContent = `${dom.newSize.value} px`;
  });

  dom.mergeKingdom.addEventListener("change", () => {
    const otherId = dom.mergeKingdom.value;
    if (!otherId || !selectedId) return;
    mergeKingdomInto(selectedId, otherId);
  });
  dom.editCapital.addEventListener("change", () => {
    const kingdom = byId(selectedId);
    if (!kingdom) return;
    pushUndo();
    kingdom.capitalId = dom.editCapital.value;
    afterChange("Capital set");
  });

  // Folds another kingdom's landmasses into this one and removes it. The way to
  // repair territories that were drawn as separate kingdoms by mistake.
  function mergeKingdomInto(hostId, otherId) {
    const host = byId(hostId);
    const other = byId(otherId);
    if (!host || !other || host === other) return;
    pushUndo();
    host.parts.push(...other.parts.map(part => part.map(p => ({ ...p }))));
    kingdoms = kingdoms.filter(k => k.id !== other.id);
    pathCache.delete(host.id);
    selectedId = host.id;
    afterChange(`${other.name} absorbed into ${host.name} — ${host.parts.length} parts`);
    openInspector();
  }

  // Escape hatch for an outline captured in more detail than it needs.
  function simplifyKingdom() {
    const kingdom = byId(selectedId);
    if (!kingdom) return;
    const before = totalPoints(kingdom);
    const tolerance = Math.max(detailTolerance() * 2.5, 6 / scale);
    const reduced = kingdom.parts.map(part => {
      const next = simplifyPath(part, tolerance);
      return next.length >= 3 ? next : part;
    });
    if (reduced.every((part, i) => part.length === kingdom.parts[i].length)) {
      setStatus("Already as simple as it gets at this zoom");
      return;
    }
    pushUndo();
    kingdom.parts = reduced;
    pathCache.delete(kingdom.id);
    afterChange(`Simplified ${before} → ${totalPoints(kingdom)} points`);
  }

  function duplicateKingdom() {
    const kingdom = byId(selectedId);
    if (!kingdom) return;
    pushUndo();
    const copy = clone(kingdom);
    copy.id = uid("kingdom");
    copy.name = `${kingdom.name} (copy)`;
    copy.parts = kingdom.parts.map(part => part.map(p => ({
      x: clamp(p.x + 70, 0, MAP_WIDTH),
      y: clamp(p.y + 70, 0, MAP_HEIGHT),
    })));
    kingdoms.push(copy);
    selectedId = copy.id;
    afterChange(`Duplicated as ${copy.name}`);
    openInspector();
  }

  function deleteKingdom() {
    const kingdom = byId(selectedId);
    if (!kingdom) return;
    if (!window.confirm(`Delete ${kingdom.name}? This cannot be undone except with Undo.`)) return;
    pushUndo();
    kingdoms = kingdoms.filter(k => k.id !== selectedId);
    selectedId = null;
    dom.inspector.classList.add("hidden");
    afterChange("Kingdom deleted");
  }

  /* ================================================== save / export / import */

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportKingdomJson() {
    const payload = {
      schema: "merovar.kingdom-borders.v1",
      exportedAt: new Date().toISOString(),
      map: { id: "merovar-world-map", width: MAP_WIDTH, height: MAP_HEIGHT, coordinateOrigin: "top-left" },
      kingdoms,
      manifest: buildKingdomManifest(),
    };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), "merovar-kingdoms.json");
    setStatus("Kingdom JSON exported");
  }

  function importKingdomJson(text) {
    let parsed;
    try { parsed = JSON.parse(text); } catch (error) { setStatus("That file is not valid JSON"); return; }
    const incoming = Array.isArray(parsed) ? parsed : parsed.kingdoms;
    if (!Array.isArray(incoming)) { setStatus("No kingdoms found in that file"); return; }
    const valid = incoming
      .map((raw, index) => normaliseKingdom(raw, index))
      .filter(k => k.parts.length > 0);
    if (!valid.length) { setStatus("No kingdoms with three or more points"); return; }
    if (kingdoms.length && !window.confirm(`Replace ${kingdoms.length} existing kingdom(s) with ${valid.length} imported?`)) return;
    pushUndo();
    kingdoms = valid;
    selectedId = null;
    pathCache.clear();
    dom.inspector.classList.add("hidden");
    afterChange(`Imported ${valid.length} kingdom${valid.length === 1 ? "" : "s"}`);
  }

  // The whole map as one self-contained document: artwork, settlements,
  // kingdoms, both manifests and the code, with no runtime state baked in.
  function buildStandaloneHtml() {
    persist(true);
    const cloneDoc = document.documentElement.cloneNode(true);
    const savedAt = Date.now();
    cloneDoc.querySelector("#embeddedKingdomData").textContent =
      JSON.stringify({ version: 1, savedAt, kingdoms }).replace(/</g, "\\u003c");
    cloneDoc.querySelector("#embeddedSettlementData").textContent =
      JSON.stringify({ version: 2, savedAt, settlements }).replace(/</g, "\\u003c");
    cloneDoc.querySelector("#merovarKingdomManifest").textContent =
      JSON.stringify(buildKingdomManifest()).replace(/</g, "\\u003c");
    cloneDoc.querySelector("#merovarSettlementManifest").textContent =
      JSON.stringify(buildSettlementManifest()).replace(/</g, "\\u003c");
    // Strip runtime state so the saved file opens exactly like a fresh build.
    cloneDoc.querySelector("#world").removeAttribute("style");
    cloneDoc.querySelector("#settlementLayer").innerHTML = "";
    ["#kingdomFills", "#kingdomStrokes", "#kingdomLabels", "#draftGroup", "#handleGroup"]
      .forEach(selector => { cloneDoc.querySelector(selector).innerHTML = ""; });
    cloneDoc.querySelector("#inspector").classList.add("hidden");
    // The dev server injects a live-reload script; it must not travel with the
    // file. Matched by attribute, never by content: this very script mentions
    // the reload path, so a text match would delete the whole application.
    cloneDoc.querySelectorAll("script[data-dev-reload]").forEach(node => node.remove());
    return `<!doctype html>\n${cloneDoc.outerHTML}`;
  }

  const standaloneBlob = () =>
    new Blob([buildStandaloneHtml()], { type: "text/html;charset=utf-8" });

  async function saveAsFile() {
    const blob = standaloneBlob();
    // A real save dialog where the browser offers one, so the file can go
    // straight into the project folder — over index.html if that is the intent.
    if (typeof window.showSaveFilePicker === "function") {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: "merovar-map.html",
          types: [{ description: "Web page", accept: { "text/html": [".html"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        setStatus(`Saved as ${handle.name}`);
        return;
      } catch (error) {
        if (error && error.name === "AbortError") { setStatus("Save cancelled"); return; }
        // Any other failure falls through to a plain download.
      }
    }
    downloadBlob(blob, "merovar-map.html");
    setStatus("Saved to your downloads as merovar-map.html");
  }

  // Kept alive deliberately: revoking it would break the tab showing it.
  let previewUrl = null;
  function previewFile() {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(standaloneBlob());
    // The hash asks that copy to open on the map rather than the tools.
    const opened = window.open(`${previewUrl}#view`, "_blank");
    setStatus(opened ? "Preview opened in a new tab" : "Allow pop-ups to preview the file");
  }

  /* ================================================================ wiring */

  document.querySelectorAll("#toolbar .tool[data-mode]").forEach(button => {
    button.addEventListener("click", () => {
      // Otherwise Space would re-trigger the focused button instead of panning.
      button.blur();
      setMode(button.dataset.mode);
    });
  });
  dom.finishButton.addEventListener("click", finishDraft);
  dom.cancelButton.addEventListener("click", () => cancelDraft(true));
  dom.undoButton.addEventListener("click", undo);
  dom.redoButton.addEventListener("click", redo);
  dom.deleteKingdomButton.addEventListener("click", deleteKingdom);
  document.getElementById("simplifyButton").addEventListener("click", simplifyKingdom);
  document.getElementById("duplicateButton").addEventListener("click", duplicateKingdom);
  document.getElementById("deleteButton").addEventListener("click", deleteKingdom);
  document.getElementById("closeInspectorButton").addEventListener("click", deselect);
  dom.showBorders.addEventListener("change", () => {
    document.body.classList.toggle("hide-borders", !dom.showBorders.checked);
  });
  dom.showNames.addEventListener("change", () => {
    document.body.classList.toggle("hide-names", !dom.showNames.checked);
  });
  document.getElementById("saveButton").addEventListener("click", () => {
    persist(true);
    setStatus(`Saved ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`);
  });
  document.getElementById("saveHtmlButton").addEventListener("click", saveAsFile);
  document.getElementById("previewHtmlButton").addEventListener("click", previewFile);
  document.getElementById("exportJsonButton").addEventListener("click", exportKingdomJson);
  const importInput = document.getElementById("importJsonInput");
  document.getElementById("importJsonButton").addEventListener("click", () => importInput.click());
  importInput.addEventListener("change", async () => {
    const file = importInput.files?.[0];
    if (!file) return;
    importKingdomJson(await file.text());
    importInput.value = "";
  });

  const fit = () => { userAdjustedView = false; fitMap(); };
  document.getElementById("fitButton").addEventListener("click", fit);
  document.getElementById("navFit").addEventListener("click", fit);
  document.getElementById("zoomIn").addEventListener("click", () => zoomCentre(1.5));
  document.getElementById("zoomOut").addEventListener("click", () => zoomCentre(1 / 1.5));
  const toggleFullscreen = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  };
  document.getElementById("fullscreenButton").addEventListener("click", toggleFullscreen);
  document.getElementById("navFull").addEventListener("click", toggleFullscreen);

  window.addEventListener("keydown", event => {
    if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
    const key = event.key.toLowerCase();
    if ((event.ctrlKey || event.metaKey) && key === "z") {
      event.preventDefault();
      if (event.shiftKey) redo(); else undo();
      return;
    }
    if ((event.ctrlKey || event.metaKey) && key === "y") { event.preventDefault(); redo(); return; }
    if (event.ctrlKey || event.metaKey || event.altKey) return;

    if (event.key === "Escape") {
      if (draftPath().length) cancelDraft(true);
      else if (selectedSettlementId) deselectSettlement();
      else if (selectedId) deselect();
      else setMode("move");
      return;
    }
    if (event.key === "Delete" && selectedSettlementId) { deleteSettlement(); return; }
    if (event.key === "Enter" && DRAW_MODES.includes(mode)) { finishDraft(); return; }
    if (event.key === "Backspace" && DRAW_MODES.includes(mode)) {
      event.preventDefault();
      undoLastSegment();
      return;
    }
    if (event.key === "Delete" && selectedId) { deleteKingdom(); return; }

    const step = event.shiftKey ? 240 : 80;
    switch (event.key) {
      case "ArrowLeft": offsetX += step; break;
      case "ArrowRight": offsetX -= step; break;
      case "ArrowUp": offsetY += step; break;
      case "ArrowDown": offsetY -= step; break;
      case "+": case "=": zoomCentre(1.5); return;
      case "-": case "_": zoomCentre(1 / 1.5); return;
      case "0": fit(); return;
      case "f": toggleFullscreen(); return;
      case "d": setMode("draw"); return;
      case "s": setMode("edit"); return;
      case "m": setMode("move"); return;
      default: return;
    }
    event.preventDefault();
    userAdjustedView = true;
    applyTransform();
  });

  // Space held = pan with a plain drag, in any mode. Without this, panning
  // while drawing would be indistinguishable from drawing.
  window.addEventListener("keydown", event => {
    if (event.code !== "Space" || spaceHeld) return;
    if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
    spaceHeld = true;
    event.preventDefault();
    dom.viewport.classList.add("panning");
  });
  window.addEventListener("keyup", event => {
    if (event.code !== "Space") return;
    spaceHeld = false;
    dom.viewport.classList.remove("panning");
  });
  window.addEventListener("blur", () => {
    spaceHeld = false;
    dom.viewport.classList.remove("panning");
  });
  // Right-drag pans, so the context menu must not interrupt it.
  dom.viewport.addEventListener("contextmenu", event => event.preventDefault());

  const onResize = () => { if (userAdjustedView) applyTransform(); else fitMap(); };
  window.addEventListener("resize", onResize);
  window.visualViewport?.addEventListener("resize", onResize);

  /* ====================================================== presentation mode */

  let presenting = false;
  let hoveredKingdomId = null;

  const stage = {
    root: document.getElementById("stage"),
    legendList: document.getElementById("legendList"),
    legendEmpty: document.getElementById("legendEmpty"),
    cartoucheLine: document.getElementById("cartoucheLine"),
    surveyLine: document.getElementById("surveyLine"),
    scaleLabel: document.getElementById("scaleLabel"),
    tip: document.getElementById("settlementTip"),
  };

  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // Eased camera move. Used for the opening settle and for framing a realm.
  let flight = null;
  function flyTo(target, duration = 900) {
    cancelZoom();
    if (reduceMotion || duration <= 0) {
      scale = target.scale; offsetX = target.x; offsetY = target.y;
      applyTransform();
      return;
    }
    const from = { scale, x: offsetX, y: offsetY };
    const started = performance.now();
    flight = (now) => {
      const t = clamp((now - started) / duration, 0, 1);
      const k = easeInOut(t);
      scale = from.scale + (target.scale - from.scale) * k;
      offsetX = from.x + (target.x - from.x) * k;
      offsetY = from.y + (target.y - from.y) * k;
      applyTransform();
      if (t < 1) requestAnimationFrame(flight);
      else flight = null;
    };
    requestAnimationFrame(flight);
  }

  function fitView(padding = 16, maxScale = Infinity) {
    const { w, h } = viewSize();
    const next = Math.min((w - padding * 2) / MAP_WIDTH, (h - padding * 2) / MAP_HEIGHT, maxScale);
    return { scale: next, x: (w - MAP_WIDTH * next) / 2, y: (h - MAP_HEIGHT * next) / 2 };
  }

  function frameBox(box, maxScale = 2.4) {
    const { w, h } = viewSize();
    const pad = 90;
    const next = clamp(
      Math.min((w - pad * 2) / Math.max(box.width, 1), (h - pad * 2) / Math.max(box.height, 1)),
      MIN_SCALE, maxScale);
    return {
      scale: next,
      x: w / 2 - (box.minX + box.width / 2) * next,
      y: h / 2 - (box.minY + box.height / 2) * next,
    };
  }

  // The signature moment: each realm's outline draws itself, the wash floods in
  // behind it, then the name settles.
  function inkKingdoms() {
    const groups = kingdoms.map(kingdom => nodes.get(kingdom.id)).filter(Boolean);
    groups.forEach((entry, index) => {
      const lines = [entry.halo, entry.under, entry.main];
      const targetFill = entry.fill.getAttribute("fill-opacity");
      entry.fill.setAttribute("fill-opacity", "0");
      entry.label.style.opacity = "0";
      entry.label.style.letterSpacing = "0.5em";

      if (reduceMotion) {
        entry.fill.setAttribute("fill-opacity", targetFill);
        entry.label.style.opacity = "";
        entry.label.style.letterSpacing = "";
        return;
      }

      const delay = 620 + index * 170;
      lines.forEach(line => {
        const length = line.getTotalLength ? line.getTotalLength() : 0;
        if (!length) return;
        line.style.transition = "none";
        line.style.strokeDasharray = `${length}`;
        line.style.strokeDashoffset = `${length}`;
        // Two frames so the starting offset is committed before it animates.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          line.style.transition = `stroke-dashoffset 1150ms cubic-bezier(.32,.7,.28,1) ${delay}ms`;
          line.style.strokeDashoffset = "0";
        }));
      });

      setTimeout(() => { entry.fill.setAttribute("fill-opacity", targetFill); }, delay + 620);
      setTimeout(() => {
        entry.label.style.opacity = "";
        entry.label.style.letterSpacing = "";
      }, delay + 850);
      // Dash arrays would fight the hover styles once the sequence is over.
      setTimeout(() => {
        lines.forEach(line => {
          line.style.transition = "";
          line.style.strokeDasharray = "";
          line.style.strokeDashoffset = "";
        });
      }, delay + 1900);
    });
  }

  function playIntro() {
    // Reset so the sequence replays properly on a return visit to the showcase.
    document.body.classList.remove("stage-lit", "intro-done");
    const settled = fitView();
    // Start a touch closer, so the map settles rather than simply appearing.
    scale = settled.scale * 1.07;
    offsetX = settled.x - (MAP_WIDTH * (settled.scale * 1.07 - settled.scale)) / 2;
    offsetY = settled.y - (MAP_HEIGHT * (settled.scale * 1.07 - settled.scale)) / 2;
    applyTransform();

    requestAnimationFrame(() => {
      document.body.classList.add("stage-lit");
      flyTo(settled, reduceMotion ? 0 : 1500);
      inkKingdoms();
      setTimeout(() => document.body.classList.add("intro-done"), reduceMotion ? 0 : 900);
    });
  }

  function kingdomSummary(kingdom) {
    const record = kingdomRecord(kingdom);
    const inside = settlementsInside(kingdom);
    const counts = inside.reduce((acc, item) => {
      acc[item.type] = (acc[item.type] || 0) + 1;
      return acc;
    }, {});
    return { record, inside, counts };
  }

  function renderLegend() {
    stage.legendList.textContent = "";
    stage.legendEmpty.classList.toggle("hidden", kingdoms.length > 0);
    kingdoms.forEach(kingdom => {
      const { inside } = kingdomSummary(kingdom);
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "legend-row";
      button.dataset.kingdomRow = kingdom.id;

      const swatch = document.createElement("span");
      swatch.className = "legend-swatch";
      swatch.style.background = kingdom.fillColor;
      swatch.style.borderColor = kingdom.borderColor;

      const name = document.createElement("span");
      name.className = "legend-name";
      name.textContent = kingdom.name || "Unnamed realm";

      const count = document.createElement("span");
      count.className = "legend-count";
      count.textContent = String(inside.length);

      button.append(swatch, name, count);
      button.addEventListener("click", () => showKingdomPanel(kingdom.id, button));
      button.addEventListener("pointerenter", () => emphasise(kingdom.id));
      button.addEventListener("pointerleave", () => emphasise(null));
      li.appendChild(button);
      stage.legendList.appendChild(li);
    });

    const totals = settlements.reduce((acc, item) => {
      acc[item.type] = (acc[item.type] || 0) + 1;
      return acc;
    }, {});
    stage.surveyLine.textContent =
      `${totals.city || 0} cities · ${totals.town || 0} towns · ${totals.castle || 0} castles`;
    stage.cartoucheLine.textContent = kingdoms.length
      ? `${kingdoms.length} realm${kingdoms.length === 1 ? "" : "s"} surveyed`
      : "A survey of the realms";
  }

  // Hovering a realm lifts its ink and lets the others recede.
  function emphasise(id) {
    hoveredKingdomId = id;
    nodes.forEach((entry, kingdomId) => {
      const lifted = id !== null && kingdomId === id;
      const dimmed = id !== null && kingdomId !== id;
      entry.strokeGroup.classList.toggle("lifted", lifted);
      entry.strokeGroup.classList.toggle("dimmed", dimmed);
      entry.fill.classList.toggle("dimmed", dimmed);
      entry.label.classList.toggle("dimmed", dimmed);
    });
  }

  function updateScaleBar() {
    // The bar is 74px wide; report what that spans in map units at this zoom.
    const units = Math.round(74 / scale / 50) * 50 || 50;
    stage.scaleLabel.textContent = `${units} units`;
  }

  function setPresenting(on) {
    presenting = on;
    document.body.classList.toggle("presenting", on);
    stage.root.setAttribute("aria-hidden", String(!on));
    if (on) {
      setMode("move");
      deselect();
      deselectSettlement();
      renderLegend();
      updateScaleBar();
      loadLore().then(() => { buildSearchIndex(); applyFinder(); });
    } else {
      emphasise(null);
      stage.tip.classList.add("hidden");
      // Leaving the showcase must not leave holdings dimmed on the map.
      document.body.classList.remove("filtering");
      settlementNodes.forEach(entry => {
        entry.el.classList.remove("matched", "unmatched");
      });
    }
  }

  // Presentation interactions live on the stage, not the editor's click handler.
  dom.viewport.addEventListener("pointermove", event => {
    if (!presenting) return;
    const el = document.elementFromPoint(event.clientX, event.clientY);
    const settlementEl = el?.closest('[data-map-entity="settlement"]');
    if (settlementEl) {
      const item = settlementById(settlementEl.dataset.settlementId);
      if (item) {
        const index = settlements.filter(s => s.type === item.type).indexOf(item) + 1;
        stage.tip.innerHTML = "";
        const strong = document.createElement("b");
        strong.textContent = item.name || `${capitalize(item.type)} ${index}`;
        const facts = [capitalize(item.type)];
        if (item.rulingHouse) facts.push(`House ${item.rulingHouse}`);
        if (item.population !== null) facts.push(`${groupDigits(item.population)} souls`);
        if (item.soldiers !== null) facts.push(`${groupDigits(item.soldiers)} soldiers`);
        const meta = document.createElement("span");
        meta.textContent = ` · ${facts.join(" · ")}`;
        stage.tip.append(strong, meta);
        stage.tip.style.left = `${event.clientX}px`;
        stage.tip.style.top = `${event.clientY - 8}px`;
        stage.tip.classList.remove("hidden");
      }
    } else {
      stage.tip.classList.add("hidden");
    }

    const kingdomEl = el?.closest('[data-map-entity="kingdom"]');
    const id = kingdomEl?.dataset.kingdomId ?? null;
    if (id !== hoveredKingdomId) emphasise(id);
  });

  dom.viewport.addEventListener("pointerleave", () => {
    if (!presenting) return;
    stage.tip.classList.add("hidden");
  });

  dom.viewport.addEventListener("click", event => {
    if (!presenting || pointerMoved) return;
    const el = document.elementFromPoint(event.clientX, event.clientY);
    const kingdomEl = el?.closest('[data-map-entity="kingdom"]');
    if (kingdomEl) { activateKingdom(kingdomEl.dataset.kingdomId, "click"); return; }
    if (!el?.closest('[data-map-entity="settlement"]')) emphasise(null);
  }, true);

  document.getElementById("presentButton").addEventListener("click", () => {
    setPresenting(true);
    playIntro();
  });
  document.getElementById("openEditor").addEventListener("click", () => setPresenting(false));
  document.getElementById("legendEditLink").addEventListener("click", () => setPresenting(false));

  /* =============================================================== finder */

  const finder = {
    root: document.getElementById("finder"),
    query: document.getElementById("finderQuery"),
    continent: document.getElementById("finderContinent"),
    count: document.getElementById("finderCount"),
    results: document.getElementById("finderResults"),
    empty: document.getElementById("finderEmpty"),
    chips: [...document.querySelectorAll(".finder-chip")],
  };
  let searchIndex = [];
  let activeTypes = new Set();
  const MAX_RESULTS = 40;

  const fold = (value) => (value || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g, "");

  // Built once the lore is in hand. Words and continent come from the
  // chronicle; everything else the map already knows.
  function buildSearchIndex() {
    searchIndex = settlements.map((item, i) => {
      const extra = lore?.settlements.get(item.id) || null;
      const realm = kingdoms.find(k => insideKingdom(k, item.x, item.y));
      const name = item.name || `${capitalize(item.type)} ${i + 1}`;
      return {
        id: item.id,
        name,
        type: item.type,
        house: item.rulingHouse || "",
        words: extra?.words || "",
        continent: extra?.continent || "",
        realm: realm?.name || "",
        haystack: fold([name, item.rulingHouse, extra?.words].filter(Boolean).join(" ")),
      };
    });

    const continents = [...new Set(searchIndex.map(s => s.continent).filter(Boolean))].sort();
    finder.continent.innerHTML = '<option value="">All</option>';
    for (const name of continents) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      finder.continent.appendChild(option);
    }
    finder.continent.disabled = continents.length === 0;
  }

  function currentMatches() {
    const needle = fold(finder.query.value.trim());
    const continent = finder.continent.value;
    return searchIndex.filter(entry =>
      (!needle || entry.haystack.includes(needle)) &&
      (activeTypes.size === 0 || activeTypes.has(entry.type)) &&
      (!continent || entry.continent === continent));
  }

  const filtersActive = () =>
    finder.query.value.trim() !== "" || activeTypes.size > 0 || finder.continent.value !== "";

  function paintMatches(matches) {
    const active = filtersActive();
    document.body.classList.toggle("filtering", active);
    const hit = new Set(matches.map(m => m.id));
    settlementNodes.forEach((entry, id) => {
      entry.el.classList.toggle("matched", active && hit.has(id));
      entry.el.classList.toggle("unmatched", active && !hit.has(id));
    });
  }

  function renderResults(matches) {
    finder.results.textContent = "";
    const shown = matches.slice(0, MAX_RESULTS);
    for (const entry of shown) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "finder-hit";
      button.dataset.hitId = entry.id;
      button.tabIndex = -1;
      const name = document.createElement("span");
      name.className = "hit-name";
      name.textContent = entry.name;
      const meta = document.createElement("span");
      meta.className = "hit-meta";
      meta.textContent = [entry.type, entry.house].filter(Boolean).join(" · ");
      button.append(name, meta);
      button.addEventListener("click", () => showSettlementPanel(entry.id, button));
      li.appendChild(button);
      finder.results.appendChild(li);
    }
    const first = finder.results.querySelector(".finder-hit");
    if (first) first.tabIndex = 0;

    const total = settlements.length;
    if (!filtersActive()) {
      finder.count.textContent = `${total} holdings`;
    } else {
      finder.count.textContent = `${matches.length} of ${total} holdings` +
        (matches.length > shown.length ? ` · showing ${shown.length}` : "");
    }

    const nothing = matches.length === 0;
    finder.results.classList.toggle("hidden", nothing);
    finder.empty.classList.toggle("hidden", !nothing);
    if (nothing) {
      const term = finder.query.value.trim();
      finder.empty.textContent = term
        ? `Nothing in the survey matches “${term}”. Try a holding, a house, or a house's words.`
        : "No holdings match these filters.";
    }
  }

  function applyFinder() {
    const matches = currentMatches();
    renderResults(matches);
    paintMatches(matches);
  }

  let finderTimer = null;
  finder.query.addEventListener("input", () => {
    clearTimeout(finderTimer);
    finderTimer = setTimeout(applyFinder, 180);
  });
  finder.continent.addEventListener("change", applyFinder);
  finder.chips.forEach(chip => {
    chip.addEventListener("click", () => {
      const type = chip.dataset.type;
      if (activeTypes.has(type)) activeTypes.delete(type);
      else activeTypes.add(type);
      chip.setAttribute("aria-pressed", String(activeTypes.has(type)));
      applyFinder();
    });
  });

  // Arrow keys walk the results with a roving tabindex; Escape steps back out.
  function focusResult(index) {
    const hits = [...finder.results.querySelectorAll(".finder-hit")];
    if (!hits.length) return;
    const next = hits[clamp(index, 0, hits.length - 1)];
    hits.forEach(hit => { hit.tabIndex = hit === next ? 0 : -1; });
    next.focus();
  }

  finder.root.addEventListener("keydown", event => {
    const hits = [...finder.results.querySelectorAll(".finder-hit")];
    const at = hits.indexOf(document.activeElement);
    if (event.key === "ArrowDown") {
      event.preventDefault();
      focusResult(at === -1 ? 0 : at + 1);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      if (at <= 0) finder.query.focus();
      else focusResult(at - 1);
    } else if (event.key === "Home" && at !== -1) {
      event.preventDefault();
      focusResult(0);
    } else if (event.key === "End" && at !== -1) {
      event.preventDefault();
      focusResult(hits.length - 1);
    } else if (event.key === "Escape") {
      event.preventDefault();
      if (finder.query.value) {
        finder.query.value = "";
        applyFinder();
      }
      finder.query.focus();
    }
  });

  /* =========================================================== lore panel */

  // Fetched once, on the first open. The panel works without it — the map
  // already knows every name, house and figure — so a missing or unreachable
  // lore.json costs the prose and nothing else.
  let lorePromise = null;
  let lore = null;
  function loadLore() {
    if (lorePromise) return lorePromise;
    lorePromise = fetch(new URL('data/lore.json', location.href))
      .then(response => (response.ok ? response.json() : Promise.reject(new Error(response.status))))
      .then(data => {
        lore = {
          settlements: new Map(data.settlements.map(s => [s.id, s])),
          kingdoms: new Map(data.kingdoms.map(k => [k.id, k])),
        };
        return lore;
      })
      .catch(() => { lore = null; return null; });
    return lorePromise;
  }

  const panel = {
    root: document.getElementById("lorePanel"),
    eyebrow: document.getElementById("loreEyebrow"),
    title: document.getElementById("loreTitle"),
    sub: document.getElementById("loreSub"),
    body: document.getElementById("loreBody"),
  };
  let panelReturnTo = null;
  let panelSort = { column: "population", direction: "desc" };

  const groupNumber = (n) => (n == null ? "—" : Number(n).toLocaleString("en-GB"));

  // Minimal, safe markdown: blank lines become paragraphs and *runs* become
  // emphasis. Built as nodes, never as innerHTML.
  function renderProse(markdown, into) {
    into.textContent = "";
    const paragraphs = String(markdown || "").split(/\n{2,}/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
    for (const text of paragraphs) {
      const p = document.createElement("p");
      for (const piece of text.split(/(\*[^*]+\*)/g)) {
        if (!piece) continue;
        if (/^\*[^*]+\*$/.test(piece)) {
          const em = document.createElement("em");
          em.textContent = piece.slice(1, -1);
          p.appendChild(em);
        } else {
          p.appendChild(document.createTextNode(piece));
        }
      }
      into.appendChild(p);
    }
    return paragraphs.length;
  }

  function figureList(rows) {
    const dl = document.createElement("dl");
    dl.className = "lore-figures";
    for (const [label, value] of rows) {
      if (value == null) continue;
      const row = document.createElement("div");
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.textContent = value;
      row.append(dt, dd);
      dl.appendChild(row);
    }
    return dl;
  }

  function openPanel(trigger) {
    // A fresh open from the map sets where focus goes back to; navigating
    // within the panel passes no trigger and keeps the original.
    if (trigger) panelReturnTo = trigger;
    else if (!panelReturnTo) panelReturnTo = document.activeElement;
    if (!panel.root.open) panel.root.showModal();
    panel.body.scrollTop = 0;
    // showModal runs its own focusing steps, which land after any focus() call
    // made in the same task. Claim focus once those have finished, and fall
    // back to the close button if the browser will not focus the region.
    queueMicrotask(() => {
      panel.body.focus();
      if (!panel.root.contains(document.activeElement)) {
        document.getElementById("loreClose").focus();
      }
    });
  }

  function closePanel() {
    if (panel.root.open) panel.root.close();
  }

  // Coalesced: browsers throttle rapid history writes, and the URL only needs
  // to describe where you came to rest, not every panel you passed through.
  let deepLinkTimer = null;
  function setDeepLink(params) {
    clearTimeout(deepLinkTimer);
    deepLinkTimer = setTimeout(() => writeDeepLink(params), 180);
  }

  function writeDeepLink(params) {
    const url = new URL(location.href);
    url.searchParams.delete("s");
    url.searchParams.delete("k");
    for (const [k, v] of Object.entries(params || {})) if (v) url.searchParams.set(k, v);
    const next = `${url.pathname}${url.search}${url.hash}`;
    // Browsers throttle rapid history writes, so only write on a real change.
    if (next === `${location.pathname}${location.search}${location.hash}`) return;
    history.replaceState(null, "", next);
  }

  async function showSettlementPanel(id, trigger) {
    const item = settlementById(id);
    if (!item) return;
    await loadLore();
    const extra = lore?.settlements.get(id) || null;
    const index = settlements.filter(s => s.type === item.type).indexOf(item) + 1;
    const realm = extra?.kingdomId ? byId(extra.kingdomId) : kingdoms.find(k => insideKingdom(k, item.x, item.y));

    panel.eyebrow.textContent = capitalize(item.type);
    panel.title.textContent = item.name || `${capitalize(item.type)} ${index}`;
    panel.sub.textContent = [item.rulingHouse, realm?.name].filter(Boolean).join(" · ");

    panel.body.textContent = "";
    if (extra?.words) {
      const quote = document.createElement("blockquote");
      quote.className = "lore-quote";
      quote.textContent = `“${extra.words}”`;
      panel.body.appendChild(quote);
    }
    if (extra?.banner) {
      const banner = document.createElement("p");
      banner.className = "lore-banner";
      banner.textContent = extra.banner;
      panel.body.appendChild(banner);
    }

    const ratio = item.population && item.soldiers
      ? `one sword per ${Math.round(item.population / item.soldiers).toLocaleString("en-GB")} souls`
      : null;
    panel.body.appendChild(figureList([
      ["Ruling house", item.rulingHouse || null],
      ["Population", item.population != null ? groupNumber(item.population) : null],
      ["Soldiers", item.soldiers != null ? groupNumber(item.soldiers) : null],
      ["Ratio", ratio],
    ]));

    const prose = document.createElement("div");
    prose.className = "lore-prose";
    const paragraphs = renderProse(extra?.story || item.notes, prose);
    if (!paragraphs) {
      const empty = document.createElement("p");
      empty.className = "lore-empty";
      empty.textContent = lore
        ? "The chronicle records no history for this holding."
        : "The chronicle could not be loaded, so only the survey figures are shown.";
      prose.appendChild(empty);
    }
    panel.body.appendChild(prose);

    if (realm) {
      const link = document.createElement("button");
      link.type = "button";
      link.className = "lore-link";
      link.textContent = `Read about ${realm.name}`;
      link.addEventListener("click", () => showKingdomPanel(realm.id));
      panel.body.appendChild(link);
    }

    setDeepLink({ s: id });
    openPanel(trigger);
  }

  async function showKingdomPanel(id, trigger) {
    const kingdom = byId(id);
    if (!kingdom) return;
    await loadLore();
    const extra = lore?.kingdoms.get(id) || null;
    const inside = settlementsInside(kingdom);
    const capital = settlements.find(s => s.id === kingdom.capitalId);

    panel.eyebrow.textContent = extra?.continent || "Realm";
    panel.title.textContent = kingdom.name || "Unnamed realm";
    panel.sub.textContent = kingdom.rulingHouse ? `Ruled by ${kingdom.rulingHouse}` : "";

    panel.body.textContent = "";
    const population = inside.reduce((sum, s) => sum + (s.population || 0), 0);
    const soldiers = inside.reduce((sum, s) => sum + (s.soldiers || 0), 0);
    panel.body.appendChild(figureList([
      ["Continent", extra?.continent || null],
      ["Capital", capital ? (capital.name || capitalize(capital.type)) : null],
      ["Holdings", String(inside.length)],
      ["Population", groupNumber(population)],
      ["Soldiers", groupNumber(soldiers)],
      ["Ratio", population && soldiers ? `one sword per ${Math.round(population / soldiers)} souls` : null],
    ]));

    if (extra?.intro) {
      const prose = document.createElement("div");
      prose.className = "lore-prose";
      renderProse(extra.intro, prose);
      panel.body.appendChild(prose);
    }

    const table = document.createElement("table");
    table.className = "lore-table";
    const caption = document.createElement("caption");
    caption.className = "lore-eyebrow";
    caption.style.textAlign = "left";
    caption.style.padding = "18px 0 4px";
    caption.textContent = `${inside.length} holdings`;
    table.appendChild(caption);

    const head = document.createElement("thead");
    const headRow = document.createElement("tr");
    const columns = [["name", "Holding"], ["type", "Type"], ["population", "Souls"], ["soldiers", "Swords"]];
    for (const [column, label] of columns) {
      const th = document.createElement("th");
      th.scope = "col";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "lore-sort";
      button.textContent = label;
      button.addEventListener("click", () => {
        panelSort = panelSort.column === column
          ? { column, direction: panelSort.direction === "asc" ? "desc" : "asc" }
          : { column, direction: column === "name" || column === "type" ? "asc" : "desc" };
        showKingdomPanel(id);
      });
      th.appendChild(button);
      if (panelSort.column === column) {
        th.setAttribute("aria-sort", panelSort.direction === "asc" ? "ascending" : "descending");
      }
      headRow.appendChild(th);
    }
    head.appendChild(headRow);
    table.appendChild(head);

    const sorted = inside.slice().sort((a, b) => {
      const column = panelSort.column;
      const av = column === "name" ? (a.displayName || "") : column === "type" ? a.type : (a[column] ?? -1);
      const bv = column === "name" ? (b.displayName || "") : column === "type" ? b.type : (b[column] ?? -1);
      const order = typeof av === "string" ? av.localeCompare(bv) : av - bv;
      return panelSort.direction === "asc" ? order : -order;
    });

    const tbody = document.createElement("tbody");
    for (const holding of sorted) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = columns.length;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "holding-row";
      button.dataset.holdingId = holding.id;
      const name = document.createElement("span");
      name.className = "holding-name";
      name.textContent = holding.displayName;
      const meta = document.createElement("span");
      meta.className = "holding-meta";
      meta.textContent = `${holding.type} · ${groupNumber(holding.population)}`;
      button.append(name, meta);
      button.addEventListener("click", () => showSettlementPanel(holding.id));
      td.appendChild(button);
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    panel.body.appendChild(table);

    setDeepLink({ k: id });
    openPanel(trigger);
  }

  document.getElementById("loreClose").addEventListener("click", closePanel);
  panel.root.addEventListener("close", () => {
    // Closing is terminal, so drop any pending write and clear immediately.
    clearTimeout(deepLinkTimer);
    writeDeepLink(null);
    const target = panelReturnTo;
    panelReturnTo = null;
    if (target && document.contains(target)) target.focus();
  });
  // Clicking the backdrop dismisses, as a sheet should.
  panel.root.addEventListener("click", event => {
    if (event.target === panel.root) closePanel();
  });

  /* ================================================================== APIs */

  window.MerovarMapAPI = Object.freeze({
    getManifest: () => clone(buildSettlementManifest()),
    getSettlements: () => clone(buildSettlementManifest().settlements),
    getSettlement: id => clone(buildSettlementManifest().settlements.find(item => item.id === id) || null),
    getByType: type => clone(buildSettlementManifest().settlements.filter(item => item.type === type)),
    getElement: id => document.querySelector(`[data-settlement-id="${CSS.escape(id)}"]`),
    activate: (id, source = "api") => activateSettlement(id, source),
    editable: true,
    eventName: "merovar:settlement-click",
    selector: '.settlement[data-map-entity="settlement"]',
  });

  window.MerovarKingdomAPI = Object.freeze({
    getAllKingdoms: () => clone(buildKingdomManifest().kingdoms),
    getKingdomById: id => {
      const kingdom = byId(id);
      return kingdom ? clone(kingdomRecord(kingdom)) : null;
    },
    selectKingdom: id => selectKingdom(id, "api"),
    showKingdom: id => {
      const kingdom = byId(id);
      if (!kingdom) return false;
      kingdom.hidden = false;
      afterChange(null);
      return true;
    },
    hideKingdom: id => {
      const kingdom = byId(id);
      if (!kingdom) return false;
      kingdom.hidden = true;
      afterChange(null);
      return true;
    },
    getSettlementsInsideKingdom: id => {
      const kingdom = byId(id);
      return kingdom ? clone(settlementsInside(kingdom)) : [];
    },
    getManifest: () => clone(buildKingdomManifest()),
    getElements: id => [...document.querySelectorAll(`[data-kingdom-id="${CSS.escape(id)}"]`)],
    eventName: "merovar:kingdom-click",
    selector: '[data-map-entity="kingdom"]',
  });

  /* ================================================================= start */

  loadSettlements();
  loadKingdoms();
  buildCapitalOptions();
  renderPalette();
  syncSettlements();
  updateSettlementManifest();
  render();
  updateKingdomManifest();
  setMode("move");
  fitMap();

  // ---------------------------------------------------------------------
  // Which face the site opens with.
  //
  //   "editor"   — the drawing and naming tools (what you want while building)
  //   "showcase" — the presentation layer with the intro sequence
  //
  // Change this single value to "showcase" when the borders are finished and
  // the map is ready to be shown. Nothing else needs to move: both faces stay
  // in the build either way, and ?edit / ?view override this per visit.
  const OPENS_WITH = "editor";
  // ---------------------------------------------------------------------

  // A blob URL carries no query string, so the hash works as well as ?view.
  const params = new URLSearchParams(location.search);
  const hash = location.hash.replace(/^#/, "");
  const asked = params.has("view") || hash === "view" ? "showcase"
    : params.has("edit") || hash === "edit" ? "editor"
    : null;
  const opening = asked || OPENS_WITH;

  if (opening === "showcase") {
    setPresenting(true);
    playIntro();
  } else {
    setPresenting(false);
  }

  // ?s=<settlementId> / ?k=<kingdomId> reopen a panel on load, so a view can be
  // shared and comes back the same.
  {
    const deep = new URLSearchParams(location.search);
    const wantSettlement = deep.get("s");
    const wantKingdom = deep.get("k");
    if (wantSettlement || wantKingdom) {
      setTimeout(() => {
        if (wantSettlement && settlementById(wantSettlement)) showSettlementPanel(wantSettlement);
        else if (wantKingdom && byId(wantKingdom)) showKingdomPanel(wantKingdom);
      }, 0);
    }
  }

  window.MerovarFile = Object.freeze({
    html: () => buildStandaloneHtml(),
    save: () => saveAsFile(),
    preview: () => previewFile(),
  });

  window.MerovarStage = Object.freeze({
    present: () => { setPresenting(true); playIntro(); },
    edit: () => setPresenting(false),
    focus: (id, trigger) => showKingdomPanel(id, trigger),
    isPresenting: () => presenting,
  });
})();
</script>
</body></html>
